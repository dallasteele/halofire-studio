ves at least one non-zero interior cut interval; no one section is selected from plural coverage</text><text x="48" y="148" fill="#94a3b8" font-size="12" font-family="Arial">NATIVE PLAN VIEW · ROTATED 90° FOR LEGIBILITY</text><rect x="1082" y="124" width="494" height="598" rx="10" fill="#10243a" stroke="#334155"/><text x="1110" y="164" fill="#e2e8f0" font-size="18" font-family="Arial">SOURCE COVERAGE RECEIPT</text><text x="1110" y="207" fill="#22d3ee" font-size="26" font-family="Arial">19</text><text x="1110" y="230" fill="#cbd5e1" font-size="13" font-family="Arial">slope targets inspected after region association</text><text x="1110" y="278" fill="#fbbf24" font-size="26" font-family="Arial">13</text><text x="1110" y="301" fill="#cbd5e1" font-size="13" font-family="Arial">resolved targets have plural cut coverage</text><text x="1110" y="349" fill="#fb7185" font-size="26" font-family="Arial">0</text><text x="1110" y="372" fill="#cbd5e1" font-size="13" font-family="Arial">resolved targets lack interior cut coverage</text><line x1="1110" y1="405" x2="1544" y2="405" stroke="#334155"/><text x="1110" y="440" fill="#f8fafc" font-size="14" font-family="Arial">What this proves</text><text x="1110" y="465" fill="#cbd5e1" font-size="13" font-family="Arial">Explicit plan-cut/view references cover source regions.</text><text x="1110" y="511" fill="#f8fafc" font-size="14" font-family="Arial">What remains blocked</text><text x="1110" y="536" fill="#fbbf24" font-size="13" font-family="Arial">section selection · slope direction · roof plane</text><text x="1110" y="560" fill="#fbbf24" font-size="13" font-family="Arial">elevation · members · heads · pipes · code</text><text x="1110" y="599" fill="#f8fafc" font-size="12" font-family="Arial">NATIVE REFERENCES</text><text x="1110" y="625" fill="#fbbf24" font-size="11" font-family="Arial">C1/A-307</text><text x="1110" y="643" fill="#fb7185" font-size="11" font-family="Arial">C3/G-006</text><text x="1110" y="661" fill="#a78bfa" font-size="11" font-family="Arial">A3/A-302</text><text x="1110" y="679" fill="#34d399" font-size="11" font-family="Arial">A3/A-304</text><text x="1110" y="697" fill="#60a5fa" font-size="11" font-family="Arial">C1/A-305</text><text x="1324" y="625" fill="#f97316" font-size="11" font-family="Arial">C1/A-306</text><text x="1324" y="643" fill="#e879f9" font-size="11" font-family="Arial">A3/A-301</text><text x="1324" y="661" fill="#2dd4bf" font-size="11" font-family="Arial">A2/A-453</text><text x="1324" y="679" fill="#facc15" font-size="11" font-family="Arial">A2/A-455</text><text x="1324" y="697" fill="#94a3b8" font-size="11" font-family="Arial">A1/A-407a</text><text x="34" y="746" fill="#94a3b8" font-size="12" font-family="Arial">A boundary touch alone is excluded. This receipt requires a non-zero interior segment interval and never uses nearest-cut heuristics.</text></svg>