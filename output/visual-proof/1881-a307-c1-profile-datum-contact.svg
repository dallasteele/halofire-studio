xt x="1110" y="566" fill="#f8fafc" font-size="14" font-family="Arial">What stays blocked</text><text x="1110" y="591" fill="#fbbf24" font-size="13" font-family="Arial">roof plane · member placement · sprinkler heads</text><text x="1110" y="615" fill="#fbbf24" font-size="13" font-family="Arial">pipes · fabrication · code · employee/VPS use</text><text x="34" y="746" fill="#94a3b8" font-size="12" font-family="Arial">The receipt uses native entity sequence and closed-segment contact only; it does not choose the nearest roof profile.</text></svg>