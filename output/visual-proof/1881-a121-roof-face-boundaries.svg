ke="#334155"/><text x="1110" y="365" fill="#f8fafc" font-size="14" font-family="Arial">What this proves</text><text x="1110" y="391" fill="#cbd5e1" font-size="13" font-family="Arial">Issued A-121 plan geometry and handles.</text><text x="1110" y="439" fill="#f8fafc" font-size="14" font-family="Arial">What stays blocked</text><text x="1110" y="465" fill="#fbbf24" font-size="13" font-family="Arial">roof planes · slope vectors · elevations</text><text x="1110" y="489" fill="#fbbf24" font-size="13" font-family="Arial">members · heads · pipes · clearances</text><text x="1110" y="513" fill="#fbbf24" font-size="13" font-family="Arial">fabrication · code · employee/VPS use</text><text x="1110" y="684" fill="#94a3b8" font-size="12" font-family="Arial">Color is only a visual discriminator.</text><text x="34" y="746" fill="#94a3b8" font-size="12" font-family="Arial">HATCH boundaries are preferred where native; closed roof-edge LWPOLYLINE loops are used only where no HATCH exists. Source coordinates are unchanged.</text></svg>