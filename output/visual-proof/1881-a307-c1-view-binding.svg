>What stays blocked</text><text x="1110" y="541" fill="#fbbf24" font-size="13" font-family="Arial">profile-edge datum tie · slope direction</text><text x="1110" y="565" fill="#fbbf24" font-size="13" font-family="Arial">plan-region mapping · roof plane · 3D</text><text x="1110" y="589" fill="#fbbf24" font-size="13" font-family="Arial">members · heads · pipes · code · VPS</text><text x="34" y="746" fill="#94a3b8" font-size="12" font-family="Arial">The receipt rejects title/viewport ambiguity and emits only roof-layer linework fully inside the exact bound model-space viewport.</text></svg>