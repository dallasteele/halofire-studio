// ── Simple SVG Bar Chart ──
function svgBarChart(data, width, height, key1, key2, color1, color2) {
  var w=width, h=height, max=0, pad=40, gap=8;
  data.forEach(function(d){ if(d[key1]>max)max=d[key1]; if(key2&&d[key2]>max)max=d[key2]; });
  max = max * 1.1;
  var barW = key2 ? ((w-pad*2)/data.length - gap*2)/2 : (w-pad*2)/data.length - gap;
  var svg = '<svg width="'+w+'" height="'+h+'" style="display:block">';
  // Grid lines
  for(var i=0;i<=4;i++){
    var y = pad + (h-pad*2) * i/4;
    svg += '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="#1e1e2e" stroke-dasharray="3,3"/>';
    svg += '<text x="'+(pad-5)+'" y="'+(y+4)+'" fill="#5a5a72" font-size="10" text-anchor="end">$'+(Math.round(max*(1-i/4)/1000))+'k</text>';
  }
  data.forEach(function(d,idx){
    var x = pad + idx * ((w-pad*2)/data.length) + gap;
    var h1 = (d[key1]/max) * (h-pad*2);
    svg += '<rect x="'+x+'" y="'+(h-pad-h1)+'" width="'+barW+'" height="'+h1+'" rx="3" fill="'+color1+'" opacity="0.9"/>';
    if(key2){
      var h2 = (d[key2]/max) * (h-pad*2);
      svg += '<rect x="'+(x+barW+2)+'" y="'+(h-pad-h2)+'" width="'+barW+'" height="'+h2+'" rx="3" fill="'+color2+'" opacity="0.9"/>';
    }
    svg += '<text x="'+(x+barW)+'" y="'+(h-10)+'" fill="#5a5a72" font-size="10" text-anchor="middle">'+d.month+'</text>';
  });
  svg += '</svg>';
  return svg;
}

// ── Simple SVG Area Chart ──
function svgAreaChart(data, width, height, key1, key2, color1, color2) {
  var w=width, h=height, max=0, pad=40;
  data.forEach(function(d){ if(d[key1]>max)max=d[key1]; if(key2&&d[key2]>max)max=d[key2]; });
  max = max * 1.1;
  var step = (w-pad*2)/(data.length-1);

  function points(key){
    return data.map(function(d,i){ return (pad+i*step)+','+(h-pad-(d[key]/max)*(h-pad*2)); }).join(' ');
  }
  function areaPath(key){
    var pts = data.map(function(d,i){ return (pad+i*step)+','+(h-pad-(d[key]/max)*(h-pad*2)); });
    return 'M'+pts.join(' L')+' L'+(pad+(data.length-1)*step)+','+(h-pad)+' L'+pad+','+(h-pad)+' Z';
  }

  var svg = '<svg width="'+w+'" height="'+h+'" style="display:block">';
  svg += '<defs><linearGradient id="ag1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color1+'" stop-opacity="0.3"/><stop offset="100%" stop-color="'+color1+'" stop-opacity="0"/></linearGradient>';
  if(key2) svg += '<linearGradient id="ag2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color2+'" stop-opacity="0.2"/><stop offset="100%" stop-color="'+color2+'" stop-opacity="0"/></linearGradient>';
  svg += '</defs>';
  for(var i=0;i<=4;i++){
    var y=pad+(h-pad*2)*i/4;
    svg += '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="#1e1e2e" stroke-dasharray="3,3"/>';
    svg += '<text x="'+(pad-5)+'" y="'+(y+4)+'" fill="#5a5a72" font-size="10" text-anchor="end">$'+(Math.round(max*(1-i/4)/1000))+'k</text>';
  }
  svg += '<path d="'+areaPath(key1)+'" fill="url(#ag1)"/>';
  svg += '<polyline points="'+points(key1)+'" fill="none" stroke="'+color1+'" stroke-width="2"/>';
  if(key2){
    svg += '<path d="'+areaPath(key2)+'" fill="url(#ag2)"/>';
    svg += '<polyline points="'+points(key2)+'" fill="none" stroke="'+color2+'" stroke-width="2"/>';
  }
  data.forEach(function(d,i){
    svg += '<text x="'+(pad+i*step)+'" y="'+(h-10)+'" fill="#5a5a72" font-size="10" text-anchor="middle">'+d.month+'</text>';
  });
  svg += '</svg>';
  return svg;
}

// ── Simple SVG Donut ──
function svgDonut(data, size) {
  var r=size/2, cr=r*0.55, or=r*0.7, total=0;
  data.forEach(function(d){total+=d.value});
  var svg = '<svg width="'+size+'" height="'+size+'" style="display:block;margin:0 auto">';
  var angle = -90;
  data.forEach(function(d){
    var pct = d.value/total;
    var a1 = angle * Math.PI/180;
    var a2 = (angle + pct*360) * Math.PI/180;
    var large = pct > 0.5 ? 1 : 0;
    var x1=r+or*Math.cos(a1), y1=r+or*Math.sin(a1);
    var x2=r+or*Math.cos(a2), y2=r+or*Math.sin(a2);
    var ix1=r+cr*Math.cos(a1), iy1=r+cr*Math.sin(a1);
    var ix2=r+cr*Math.cos(a2), iy2=r+cr*Math.sin(a2);
    svg += '<path d="M'+x1+','+y1+' A'+or+','+or+' 0 '+large+',1 '+x2+','+y2+' L'+ix2+','+iy2+' A'+cr+','+cr+' 0 '+large+',0 '+ix1+','+iy1+' Z" fill="'+d.color+'"/>';
    angle += pct*360;
  });
  svg += '</svg>';
  return svg;
}

      '<input id="priceSearchInput" type="text" placeholder="Search items..." value="'+esc(state.priceSearch)+'" style="width:100%;padding:8px 12px 8px 36px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none"></div>'+
      '<div style="display:flex;gap:6px">'+cats+'</div></div>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>'+
      ['Item','Supplier','Price','Unit','Category','Updated'].map(function(h){return '<th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)">'+h+'</th>'}).join('')+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'
  )+'</div>';
}

// ── COMPLIANCE ──
function renderCompliance() {
  var dueSoon = COMPLIANCE.filter(function(c){return c.status==='Due Soon'}).length;
  var rows = COMPLIANCE.map(function(c){
    var days = Math.ceil((new Date(c.dueDate)-new Date())/864e5);
    var dc = days<7?'var(--danger)':days<14?'var(--warning)':'var(--text)';
    return '<tr><td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);font-weight:600;color:var(--white)">'+esc(c.project)+'</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)">'+esc(c.type)+'</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)">'+esc(c.authority)+'</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);color:'+dc+'">'+c.dueDate+' ('+days+'d)</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)">'+statusBadge(c.status)+'</td></tr>';
  }).join('');

  return '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">'+
    statCard('compliance','Total Items',String(COMPLIANCE.length),null,null,'var(--info)')+
    statCard('clock','Due Soon',String(dueSoon),null,null,'var(--warning)')+
    statCard('check','Compliance Rate','98%',null,null,'var(--success)')+
    statCard('fire','Open Inspections','3',null,null,'var(--primary)')+
  '</div><div style="margin-top:20px">'+card('<h3 style="font-size:15px;font-weight:700;color:var(--white);margin-bottom:16px">Compliance Tracker</h3>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>'+
      ['Project','Type','Authority','Due Date','Status'].map(function(h){return '<th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)">'+h+'</th>'}).join('')+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>')+'</div>';
}

// ── ANALYTICS ──

  var mData = REVENUE.map(function(d){return {month:d.month,revenue:d.revenue,profit:d.revenue-d.expenses}});
  var projRows = PROJECTS.map(function(p){
    return '<tr><td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);font-weight:600;color:var(--white)">'+esc(p.name)+'</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)">'+money(p.budget)+'</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)">'+money(p.spent)+'</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:8px;min-width:120px">'+progressBar(p.progress,p.progress>=90?'var(--success)':'var(--primary)')+'<span style="font-size:12px;font-weight:500">'+p.progress+'%</span></div></td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)">'+statusBadge(p.status)+'</td>'+
      '<td style="padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)">'+esc(p.manager)+'</td></tr>';
  }).join('');

  return '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">'+
    statCard('dollar','Total Revenue','$3.7M','18%','up','var(--success)')+
    statCard('analytics','Avg Deal Size','$487K','5%','up','var(--info)')+
    statCard('clock','Avg Close Time','32 days','8%','down','var(--warning)')+
    statCard('projects','Backlog Value','$2.1M',null,null,'var(--primary)')+
  '</div><div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
    card('<h3 style="font-size:15px;font-weight:700;color:var(--white);margin-bottom:16px">Revenue vs Profit</h3><div style="overflow-x:auto">'+svgBarChart(mData,480,260,'revenue','profit','#e53935','#4caf50')+'</div>'+
      '<div style="display:flex;gap:16px;margin-top:8px;justify-content:center"><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)"><span style="width:12px;height:12px;background:#e53935;border-radius:2px;display:inline-block"></span>Revenue</span><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)"><span style="width:12px;height:12px;background:#4caf50;border-radius:2px;display:inline-block"></span>Profit</span></div>')+
    card('<h3 style="font-size:15px;font-weight:700;color:var(--white);margin-bottom:16px">Revenue Trend</h3><div style="overflow-x:auto">'+svgAreaChart(REVENUE,480,260,'revenue','expenses','#e53935','#2196f3')+'</div>'+
      '<div style="display:flex;gap:16px;margin-top:8px;justify-content:center"><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)"><span style="width:12px;height:3px;background:#e53935;border-radius:2px;display:inline-block"></span>Revenue</span><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)"><span style="width:12px;height:3px;background:#2196f3;border-radius:2px;display:inline-block"></span>Expenses</span></div>')+
  '</div><div style="margin-top:20px">'+card('<h3 style="font-size:15px;font-weight:700;color:var(--white);margin-bottom:16px">Project Performance</h3>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>'+
      ['Project','Budget','Spent','Progress','Status','PM'].map(function(h){return '<th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)">'+h+'</th>'}).join('')+
    '</tr></thead><tbody>'+projRows+'</tbody></table></div>')+'</div>';
}

// ── Modals ──
function renderAddBidModal() {
  var overlay = document.createElement('div');
  overlay.id='modalOverlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)';
  var is = 'style="width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;font-family:var(--font)"';
  function field(l,input){return '<div style="margin-bottom:16px"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">'+l+'</label>'+input+'</div>';}
  overlay.innerHTML = '<div class="fade-in" style="width:560px;max-width:90vw;max-height:85vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:auto;box-shadow:var(--shadow-lg)">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)"><h3 style="font-size:16px;font-weight:700;color:var(--white)">New Bid Entry</h3><button id="closeModal" style="background:none;border:none;color:var(--text-muted);cursor:pointer">'+icon('x')+'</button></div>'+
    '<div style="padding:24px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      field('Project Name','<input id="newBidProject" '+is+' placeholder="e.g. Home Depot - Meridian">')+
      field('Contractor','<input id="newBidContractor" '+is+' placeholder="e.g. Turner Construction">')+
      field('Bid Value ($)','<input id="newBidValue" type="number" '+is+' placeholder="250000">')+
      field('Square Footage','<input id="newBidSqft" type="number" '+is+' placeholder="150000">')+
      field('System Type','<select id="newBidSystem" '+is+'><option>Wet</option><option>Dry</option><option>Preaction</option><option>Deluge</option><option>ESFR</option><option>Wet/Dry</option><option>Wet/Preaction</option><option>Standpipe</option></select>')+
      field('Contact','<input id="newBidContact" '+is+' placeholder="Contact name">')+
      field('Due Date','<input id="newBidDue" type="date" '+is+'>')+
    '</div>'+
    '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:24px">'+
      '<button id="cancelBid" style="padding:10px 16px;font-size:13px;font-weight:600;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border);background:var(--surface-hover);color:var(--text)">Cancel</button>'+
      '<button id="saveBid" style="padding:10px 16px;font-size:13px;font-weight:600;border-radius:var(--radius);cursor:pointer;border:none;background:var(--primary);color:var(--white)">Add Bid</button>'+
    '</div></div></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click',function(e){if(e.target===overlay){state.showAddBid=false;overlay.remove();}});
  $('#closeModal').addEventListener('click',function(){state.showAddBid=false;overlay.remove();});
  $('#cancelBid').addEventListener('click',function(){state.showAddBid=false;overlay.remove();});
  $('#saveBid').addEventListener('click',function(){
    var p=$('#newBidProject').value, c=$('#newBidContractor').value;
    if(!p||!c) return;
    BIDS.push({id:BIDS.length+1,project:p,contractor:c,value:parseFloat($('#newBidValue').value)||0,status:'Pending',date:new Date().toISOString().slice(0,10),dueDate:$('#newBidDue').value,sqft:parseInt($('#newBidSqft').value)||0,system:$('#newBidSystem').value,contact:$('#newBidContact').value});
    state.showAddBid=false;overlay.remove();render();
  });
}

function renderProjectModal() {
  var p = PROJECTS.find(function(pr){return pr.id===state.selectedProject});
  if(!p) return;
  var phases=['Design','Fabrication','Installation','Testing','Closeout'];
  var ci=phases.indexOf(p.phase);
  var timeline = phases.map(function(ph,i){
    var done=i<ci, active=i===ci;
    return '<div style="flex:1;text-align:center"><div style="height:4px;border-radius:2px;background:'+(done?'var(--success)':active?'var(--primary)':'var(--border)')+';margin-bottom:6px"></div><span style="font-size:11px;color:'+(done?'var(--success)':active?'var(--primary)':'var(--text-muted)')+';font-weight:'+(active?600:400)+'">'+ph+'</span></div>';
  }).join('');

  var overlay = document.createElement('div');
  overlay.id='modalOverlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)';
  function info(l,v,c){return '<div style="margin-bottom:16px"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">'+l+'</label><div style="color:'+(c||'var(--text)')+';font-size:14px">'+v+'</div></div>';}
  overlay.innerHTML = '<div class="fade-in" style="width:700px;max-width:90vw;max-height:85vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:auto;box-shadow:var(--shadow-lg)">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)"><h3 style="font-size:16px;font-weight:700;color:var(--white)">'+esc(p.name)+'</h3><button id="closeProjModal" style="background:none;border:none;color:var(--text-muted);cursor:pointer">'+icon('x')+'</button></div>'+
    '<div style="padding:24px"><div style="display:flex;gap:4px;margin-bottom:24px">'+timeline+'</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      '<div>'+info('Project Manager',esc(p.manager))+info('Start Date',p.startDate)+info('End Date',p.endDate)+'</div>'+
      '<div>'+info('Budget',money(p.budget))+info('Spent',money(p.spent),p.spent>p.budget*.9?'var(--danger)':'')+info('Remaining',money(p.budget-p.spent),'var(--success)')+'</div>'+
    '</div>'+
    '<div style="margin-top:16px"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Budget Utilization</label>'+
      progressBar(p.spent/p.budget*100,p.spent>p.budget*.9?'var(--danger)':'var(--success)',10)+
      '<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:11px;color:var(--text-muted)">'+Math.round(p.spent/p.budget*100)+'% used</span><span style="font-size:11px;color:var(--text-muted)">'+money(p.budget-p.spent)+' remaining</span></div></div></div></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click',function(e){if(e.target===overlay){state.selectedProject=null;overlay.remove();}});
  $('#closeProjModal').addEventListener('click',function(){state.selectedProject=null;overlay.remove();});
}

// ── Event Binding ──
function bindEvents() {
  // Login
  var loginForm = document.getElementById('loginForm');
  if(loginForm) {
    var doLogin = function(e) {
      if(e) e.preventDefault();
      var u = document.getElementById('loginUser').value;
      var p = document.getElementById('loginPass').value;
      if(u==='admin' && p==='halofire2026'){
        state.user = {username:'admin',name:'Dallas Steele',role:'President'};
        render();
      } else {
        var err = document.getElementById('loginError');
        if(err) { err.style.display='block'; err.textContent='Invalid credentials'; }
      }
    };
    loginForm.addEventListener('submit', doLogin);
    var signInBtn = loginForm.querySelector('button[type="submit"]');
    if(signInBtn) signInBtn.addEventListener('click', doLogin);
  }

  // Nav
  $$('[data-nav]').forEach(function(btn){
    btn.addEventListener('click', function(){ state.page=this.dataset.nav; render(); });
  });

  // Sidebar toggle
  var st=$('#sidebarToggle'); if(st) st.addEventListener('click',function(){state.sidebarCollapsed=!state.sidebarCollapsed;render();});
  var mt=$('#menuToggle'); if(mt) mt.addEventListener('click',function(){state.sidebarCollapsed=!state.sidebarCollapsed;render();});

  // Logout
  var lb=$('#logoutBtn'); if(lb) lb.addEventListener('click',function(){state.user=null;render();});

  // Bid filters
  $$('[data-bidfilter]').forEach(function(btn){
    btn.addEventListener('click',function(){state.bidFilter=this.dataset.bidfilter;render();});
  });

  // Bid status change
  $$('[data-bidstatus]').forEach(function(sel){
    sel.addEventListener('change',function(){
      var id=parseInt(this.dataset.bidstatus);
      BIDS.forEach(function(b){if(b.id===id)b.status=sel.value;});
      render();
    });
  });

  // Add bid
  var ab=$('#addBidBtn'); if(ab) ab.addEventListener('click',function(){state.showAddBid=true;renderAddBidModal();});

  // Calculate estimate
  var cb=$('#calcBtn'); if(cb) cb.addEventListener('click',function(){
    var sqft=parseFloat($('#estSqft').value)||0;
    var stories=parseInt($('#estStories').value)||1;
    var dm={Light:1,Ordinary:1.3,'Extra Hazard':1.8}[$('#estHazard').value]||1;
    var sm={Wet:1,Dry:1.35,Preaction:1.5,Deluge:1.6,ESFR:1.25,'Wet/Dry':1.2,Standpipe:.6}[$('#estSystem').value]||1;
    var mc=sqft*3.5*dm*sm*stories;
    var lh=sqft/200*dm*stories;
    var lc=lh*(parseFloat($('#estLabor').value)||85);
    var sub=mc+lc;
    var mk=sub*((parseFloat($('#estMarkup').value)||25)/100);
    var tot=sub+mk;
    state.estimateResult={materialCost:Math.round(mc),laborHours:Math.round(lh),laborCost:Math.round(lc),subtotal:Math.round(sub),markup:Math.round(mk),total:Math.round(tot),pricePerSqft:sqft?(tot/sqft).toFixed(2):'0',headCount:Math.ceil(sqft/130*dm),pipeLength:Math.ceil(sqft/20*dm)};
    render();
  });

  // Project cards
  $$('[data-project]').forEach(function(el){
    el.addEventListener('click',function(){state.selectedProject=parseInt(this.dataset.project);renderProjectModal();});
  });

  // Price search
  var ps=$('#priceSearchInput'); if(ps) ps.addEventListener('input',function(){state.priceSearch=this.value;render();});

  // Price category
  $$('[data-pricecat]').forEach(function(btn){
    btn.addEventListener('click',function(){state.priceCat=this.dataset.pricecat;render();});
  });
}

// ── Start ──
render();
</script>
