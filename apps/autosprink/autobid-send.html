<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>HaloFire — AutoBid · Review &amp; Send</title>
<link rel="stylesheet" href="/public/styles/halofire-glass.css?v=13" />
<style>
  .wrap{ max-width:1240px; margin:0 auto; padding:18px 24px 90px; }
  .crumbs{ font-size:var(--hf-fs-label); color:var(--hf-muted); margin:4px 0 10px; }
  .crumbs a{ color:var(--hf-color-interactive-text,#9ec3ff); text-decoration:none; }
  .head{ display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap; margin-bottom:16px; }
  .head .jn{ font-family:var(--hf-display); font-size:26px; font-weight:600; }
  .head .loc{ color:var(--hf-muted); font-size:var(--hf-fs-sm); margin-top:2px; }
  .head .spacer{ flex:1; }
  .headline{ text-align:right; }
  .headline .big{ font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .headline .band{ font-size:var(--hf-fs-label); color:var(--hf-muted); margin-top:3px; }
  .cols{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:16px; align-items:start; }
  .phd{ display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--hf-line); }
  .phd .t{ font-size:var(--hf-fs-label); letter-spacing:0.9px; text-transform:uppercase; color:var(--hf-muted); font-weight:600; flex:1; }
  .pbd{ padding:14px; }
  .note{ color:var(--hf-muted); font-size:var(--hf-fs-sm); line-height:1.55; }
  .mt{ margin-top:16px; }
  .stat{ display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--hf-line); font-size:var(--hf-fs-sm); }
  .stat:first-child{ border-top:0; }
  .stat .l{ color:var(--hf-muted); } .stat .v{ font-weight:600; font-variant-numeric:tabular-nums; }
  .pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.ok{ background:rgba(74,222,128,0.14); color:#86efac; border:1px solid rgba(74,222,128,0.35); }
  .pill.warn{ background:rgba(251,191,36,0.14); color:#fcd34d; border:1px solid rgba(251,191,36,0.35); }
  /* Honest per-type confidence flag (engine confidence block) */
  .conf{ display:flex; align-items:flex-start; gap:10px; margin:2px 0 16px; padding:11px 14px; border:1px solid var(--hf-line); border-radius:var(--hf-r-win,12px); background:var(--hf-glass,rgba(255,255,255,0.03)); }
  .conf .cb{ display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:0.3px; white-space:nowrap; flex:none; }
  .conf .cb.grade{ background:rgba(74,222,128,0.16); color:#86efac; border:1px solid rgba(74,222,128,0.4); }
  .conf .cb.approx{ background:rgba(251,191,36,0.16); color:#fcd34d; border:1px solid rgba(251,191,36,0.4); }
  .conf .cn{ font-size:var(--hf-fs-sm); color:var(--hf-muted); line-height:1.5; }
  .conf .cn b{ color:var(--hf-text); }
  .bar{ display:flex; align-items:center; gap:10px; margin:6px 0; font-size:var(--hf-fs-sm); }
  .bar .lab{ width:120px; color:var(--hf-muted); flex:none; }
  .bar .track{ flex:1; height:9px; border-radius:6px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .bar .fill{ height:100%; background:var(--hf-color-accent,#f0a868); border-radius:6px; }
  .bar .val{ width:84px; text-align:right; font-variant-numeric:tabular-nums; flex:none; }
  iframe.pdf{ width:100%; height:560px; border:1px solid var(--hf-line); border-radius:var(--hf-r-win,12px); background:#fff; }
  .ql{ list-style:none; margin:0; padding:0; }
  .ql li{ display:flex; gap:8px; padding:8px 0; border-top:1px solid var(--hf-line); font-size:var(--hf-fs-sm); }
  .ql li:first-child{ border-top:0; }
  .ql textarea{ flex:1; resize:vertical; min-height:34px; font:inherit; font-size:var(--hf-fs-sm); color:var(--hf-text); background:rgba(255,255,255,0.03); border:1px solid var(--hf-line); border-radius:6px; padding:6px 8px; }
  .ql .src{ flex:none; width:74px; color:var(--hf-faint); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; padding-top:8px; }
  .massing{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  /* Sprinkler design — true-scale 2D plan + verdict */
  .planwrap{ background:#0c1018; border:1px solid var(--hf-line); border-radius:10px; padding:6px; }
  .planwrap svg{ display:block; width:100%; height:auto; }
  .leg{ display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:11px; color:var(--hf-muted); }
  .leg .sw{ display:inline-block; width:18px; height:0; border-top-width:3px; border-top-style:solid; vertical-align:middle; margin-right:5px; }
  .leg .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#7dd3fc; vertical-align:middle; margin-right:5px; }
  .sizerow{ display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid var(--hf-line); font-size:var(--hf-fs-sm); font-variant-numeric:tabular-nums; }
  .floorpill{ padding:8px 10px; border:1px solid var(--hf-line); border-radius:8px; font-size:var(--hf-fs-label); display:flex; justify-content:space-between; }
  .floorpill.real{ border-color:rgba(74,222,128,0.4); } .floorpill.placeholder{ border-color:rgba(251,191,36,0.3); color:var(--hf-muted); }
  .spatial-plate{ border-top:1px solid var(--hf-line); padding-top:14px; margin-top:14px; }
  .spatial-plate:first-child{ border-top:0; padding-top:0; margin-top:0; }
  /* Bluebeam-like review frame: the stored image is a source-PDF + derived
     geometry composite.  Keep it bounded and zoomable so an estimator can
     inspect the actual pixels before recording a decision. */
  .spatial-review-frame{ margin:10px 0; border:1px solid var(--hf-line); border-radius:8px; background:#0b1018; overflow:auto; }
  .spatial-review-frame figcaption{ padding:7px 9px; border-bottom:1px solid var(--hf-line); color:var(--hf-muted); font-size:11px; line-height:1.4; }
  .spatial-review-toolbar{ display:flex; align-items:center; gap:8px; padding:7px 9px; border-bottom:1px solid var(--hf-line); color:var(--hf-muted); font-size:11px; }
  .spatial-review-toolbar input[type=range]{ flex:1; min-width:120px; accent-color:var(--hf-color-accent,#f0a868); }
  .spatial-review-toolbar output{ min-width:42px; text-align:right; color:var(--hf-text); font-variant-numeric:tabular-nums; }
  .spatial-review-frame .spatial-overlay{ display:block; width:100%; min-width:100%; height:auto; margin:0; border:0; border-radius:0; background:#fff; transform-origin:top left; }
  .spatial-review-frame .spatial-overlay[data-overlay-visible="false"]{ opacity:.65; }
  .viewport-scope{ margin:10px 0 12px; padding:10px 12px; border:1px solid rgba(240,168,104,.28); border-radius:10px; background:linear-gradient(110deg,rgba(240,168,104,.10),rgba(255,255,255,.025)); color:var(--hf-text); }
  .viewport-scope strong{ display:block; font-size:var(--hf-fs-sm); letter-spacing:.15px; }
  .viewport-scope small{ display:block; margin-top:3px; color:var(--hf-muted); line-height:1.45; }
  .viewport-review-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:8px 0 4px; }
  .viewport-review-card{ display:flex; align-items:flex-start; gap:8px; min-width:0; padding:9px 10px; border:1px solid var(--hf-line); border-radius:9px; background:rgba(255,255,255,.025); color:var(--hf-text); cursor:pointer; transition:border-color .16s ease,background .16s ease,box-shadow .16s ease; }
  .viewport-review-card:hover{ border-color:rgba(240,168,104,.5); background:rgba(240,168,104,.06); }
  .viewport-review-card:focus-within{ outline:2px solid rgba(158,195,255,.8); outline-offset:2px; }
  .viewport-review-card:has(input:checked){ border-color:rgba(74,222,128,.48); background:rgba(74,222,128,.07); box-shadow:0 0 0 1px rgba(74,222,128,.12) inset; }
  .viewport-review-card input{ flex:none; margin-top:3px; accent-color:#86efac; }
  .viewport-review-card .viewport-card-body{ min-width:0; display:flex; flex-direction:column; gap:3px; }
  .viewport-review-card .viewport-card-title{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:var(--hf-fs-sm); font-weight:650; }
  .viewport-review-card .viewport-role{ color:var(--hf-text); text-transform:capitalize; }
  .viewport-review-card .viewport-status{ color:#fcd34d; font-size:10px; letter-spacing:.35px; text-transform:uppercase; }
  .viewport-review-card:has(input:checked) .viewport-status{ color:#86efac; }
  .viewport-review-card .viewport-card-detail{ color:var(--hf-muted); font-size:11px; line-height:1.45; overflow-wrap:anywhere; }
  .viewport-review-card .viewport-card-detail code{ color:var(--hf-muted); font-size:10px; }
  @media(max-width:700px){ .viewport-review-grid{ grid-template-columns:1fr; } }
  .fp-point-review{ margin-top:10px; padding:10px; border:1px solid var(--hf-line); border-radius:8px; background:rgba(0,0,0,.18); }
  .fp-point-review-stage{ position:relative; overflow:auto; max-height:520px; background:#fff; }
  .fp-point-review-stage img{ display:block; width:100%; height:auto; }
  .fp-point-review-stage canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  .fp-point-review-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .spatial-viewport{ display:inline-block; }
  .spatial-digests{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 14px; margin-top:9px; }
  .spatial-digests code{ color:var(--hf-muted); font-size:10px; overflow-wrap:anywhere; }
  .spatial-actions{ display:flex; align-items:flex-start; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .spatial-actions textarea{ flex:1 1 280px; min-height:54px; resize:vertical; font:inherit; font-size:var(--hf-fs-sm); color:var(--hf-text); background:rgba(255,255,255,0.03); border:1px solid var(--hf-line); border-radius:6px; padding:7px 9px; }
  .spatial-review-metric{ display:flex; flex-direction:column; gap:4px; min-width:150px; color:var(--hf-muted); font-size:var(--hf-fs-sm); }
  .spatial-review-metric input{ width:100%; color:var(--hf-text); background:rgba(255,255,255,0.03); border:1px solid var(--hf-line); border-radius:6px; padding:7px 9px; font:inherit; }
  .spatial-actions .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .spatial-result{ width:100%; }
  /* Held-out density review: source-bound, diagnostic-only reviewer worklist. */
  .density-heldout-card{ border-top:1px solid var(--hf-line); padding-top:14px; margin-top:14px; }
  .density-heldout-card:first-child{ border-top:0; padding-top:0; margin-top:0; }
  .density-heldout-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 14px; margin:10px 0; }
  .density-heldout-grid .stat{ min-width:0; }
  .density-heldout-page{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .density-heldout-page select{ min-width:190px; color:var(--hf-text); background:rgba(255,255,255,.04); border:1px solid var(--hf-line); border-radius:6px; padding:7px 9px; font:inherit; }
  .density-heldout-source{ color:var(--hf-color-interactive-text,#9ec3ff); text-decoration:none; }
  .density-heldout-source:hover{ text-decoration:underline; }
  .density-heldout-form{ display:grid; grid-template-columns:minmax(140px,180px) minmax(200px,1fr) auto; gap:8px; align-items:end; margin-top:10px; }
  .density-heldout-field{ display:flex; flex-direction:column; gap:4px; color:var(--hf-muted); font-size:11px; }
  .density-heldout-field input{ width:100%; box-sizing:border-box; color:var(--hf-text); background:rgba(255,255,255,.04); border:1px solid var(--hf-line); border-radius:6px; padding:8px 9px; font:inherit; }
  .density-heldout-field input:focus{ outline:2px solid rgba(158,195,255,.75); outline-offset:1px; }
  .density-heldout-field input[aria-invalid="true"]{ border-color:#fca5a5; }
  .density-heldout-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .density-heldout-actions .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .density-heldout-result{ flex:1 1 260px; min-width:0; }
  .density-heldout-result.ok{ color:#86efac; }
  .density-heldout-result.warn{ color:#fcd34d; }
  .density-heldout-unresolved{ margin-top:10px; padding:8px 10px; border:1px solid rgba(251,191,36,.28); border-radius:8px; color:#fcd34d; font-size:var(--hf-fs-sm); }
  @media(max-width:760px){ .density-heldout-grid,.density-heldout-form{ grid-template-columns:1fr; } }
  /* One truthful operator worklist for the receipts that still need a human or
     independently-owned report.  This is a navigation aid only: it never
     changes a gate and deliberately carries no expected totals. */
  .review-action-manifest{ border:1px solid rgba(158,195,255,.28); background:linear-gradient(125deg,rgba(158,195,255,.08),rgba(255,255,255,.025)); }
  .review-action-intro{ display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .review-action-intro .signal{ width:9px; height:9px; margin-top:5px; border-radius:50%; background:#fcd34d; box-shadow:0 0 0 4px rgba(252,211,77,.12); flex:none; }
  .review-action-intro .signal.ok{ background:#86efac; box-shadow:0 0 0 4px rgba(134,239,172,.12); }
  .review-action-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .review-action{ display:flex; flex-direction:column; gap:5px; min-width:0; padding:10px 11px; border:1px solid var(--hf-line); border-radius:9px; background:rgba(0,0,0,.12); }
  .review-action-head{ display:flex; align-items:center; gap:7px; }
  .review-action-head strong{ flex:1; font-size:var(--hf-fs-sm); }
  .review-action-status{ font-size:10px; letter-spacing:.45px; text-transform:uppercase; color:#fcd34d; }
  .review-action-status.ok{ color:#86efac; }
  .review-action-detail{ color:var(--hf-muted); font-size:11px; line-height:1.45; }
  .review-action-link{ align-self:flex-start; color:var(--hf-color-interactive-text,#9ec3ff); font-size:11px; text-decoration:none; }
  .review-action-link:hover{ text-decoration:underline; }
  .review-action-count{ color:var(--hf-text); font-variant-numeric:tabular-nums; }
  .ops-flow-rail{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:0 0 18px; padding:12px; border:1px solid rgba(158,195,255,.24); border-radius:12px; background:linear-gradient(120deg,rgba(158,195,255,.08),rgba(255,255,255,.025)); }
  .ops-flow-step{ position:relative; min-width:0; padding:10px 10px 9px; border:1px solid var(--hf-line); border-radius:9px; background:rgba(0,0,0,.12); }
  .ops-flow-step:not(:last-child)::after{ content:'>'; position:absolute; right:-8px; top:50%; transform:translateY(-50%); color:#f0a868; font-size:13px; font-weight:700; z-index:1; }
  .ops-flow-step .flow-k{ display:block; color:var(--hf-muted); font-size:10px; letter-spacing:.7px; text-transform:uppercase; }
  .ops-flow-step .flow-v{ display:block; margin-top:4px; color:var(--hf-text); font-size:var(--hf-fs-sm); font-weight:650; }
  .ops-flow-step .flow-note{ display:block; margin-top:4px; color:var(--hf-faint); font-size:11px; line-height:1.35; }
  .ops-flow-step.current{ border-color:rgba(240,168,104,.55); background:rgba(240,168,104,.09); }
  .ops-flow-step.complete .flow-v{ color:#86efac; }
  @supports (animation-timeline: view()){
    @media (prefers-reduced-motion: no-preference){
      .ops-flow-rail{ animation:hf-ops-rail-reveal linear both; animation-duration:1s; animation-timeline:view(); animation-range:entry 0% cover 24%; }
      @keyframes hf-ops-rail-reveal{ from{ opacity:.72; transform:translateY(16px); } to{ opacity:1; transform:none; } }
    }
  }
  @media (prefers-reduced-motion: reduce){ .ops-flow-rail{ opacity:1; transform:none; animation:none; } }
  @media(max-width:760px){ .review-action-grid{ grid-template-columns:1fr; } }
  @media(max-width:760px){ .ops-flow-rail{ grid-template-columns:1fr 1fr; } .ops-flow-step:nth-child(2)::after{ display:none; } .ops-flow-step:nth-child(4)::after{ display:none; } }
  @media(max-width:480px){ .ops-flow-rail{ grid-template-columns:1fr; } .ops-flow-step::after{ display:none !important; } }
  .sendbar{ position:sticky; bottom:0; margin-top:18px; padding:14px 16px; display:flex; align-items:center; gap:14px; border-radius:var(--hf-r-win,12px); }
  .sendbar .summary{ flex:1; font-size:var(--hf-fs-sm); color:var(--hf-muted); }
  .btn{ font:inherit; cursor:pointer; padding:11px 22px; border-radius:var(--hf-r-ctl,7px); border:1px solid var(--hf-line); background:var(--hf-glass,rgba(255,255,255,0.04)); color:var(--hf-text); font-weight:600; }
  .btn.send{ background:var(--hf-color-accent,#f0a868); color:#1a1208; border-color:transparent; font-size:15px; padding:12px 26px; }
  .btn.send:disabled{ opacity:0.5; cursor:default; }
  .btn.send:hover:not(:disabled){ filter:brightness(1.06); }
  .bomtbl{ width:100%; border-collapse:collapse; font-size:var(--hf-fs-sm); font-variant-numeric:tabular-nums; }
  .bomtbl th{ text-align:left; font-weight:600; color:var(--hf-muted); padding:6px 8px; border-bottom:1px solid var(--hf-line); font-size:var(--hf-fs-label); }
  .bomtbl td{ padding:6px 8px; border-top:1px solid var(--hf-line); vertical-align:top; }
  @media(max-width:1000px){ .cols{ grid-template-columns:1fr; } }
</style>

<body class="hf" data-hf-page="autobid">
  <div class="wrap">
    <div class="crumbs"><a href="/autobid-board.html">← Bid Board</a> · Review &amp; Send</div>
    <div id="root"><div class="note">Loading bid package…</div></div>
  </div>

  <script src="/public/halofire-shell.js?v=13"></script>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function usd(n){ if(n==null||isNaN(n)) return '—'; return '$'+Math.round(n).toLocaleString(); }
    function api(path,opts){ return fetch('/api/autobid'+path, Object.assign({credentials:'include'}, opts||{})); }
    var REF = new URLSearchParams(location.search).get('ref');

    function bars(items, fmt){
      var max = Math.max.apply(null, items.map(function(i){return Math.abs(i.value)||0;}).concat([1]));
      return items.map(function(i){
        var pct = Math.max(2, Math.round(100*(Math.abs(i.value)||0)/max));
        return '<div class="bar"><div class="lab">'+esc(i.label)+'</div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="val">'+(fmt?fmt(i.value):i.value)+'</div></div>';
      }).join('');
    }
    // metadata keys that aren't real chart bars
    var CHART_SKIP = { available:1, type:1, render_hint:1, grouped_bar:1, systems:1, basis:1, label:1, name:1, unit:1, n_bids:1 };
    function chartItems(cd){
      // normalize an engine charts_data.* block into [{label,value}] of SCALAR numeric rows only
      if(!cd) return [];
      if(Array.isArray(cd)) return cd.map(function(x){
        return { label:(x.label||x.name||x.k||''), value:(x.value!=null?x.value:x.v) };
      }).filter(function(i){ return typeof i.value==='number' && isFinite(i.value); });
      return Object.keys(cd).map(function(k){
        var v = (cd[k] && typeof cd[k]==='object' && cd[k].value!=null) ? cd[k].value : cd[k];
        return { label:k.replace(/_/g,' '), value:v, key:k };
      }).filter(function(i){
        if(CHART_SKIP[i.key]) return false;
        if(typeof i.value!=='number' || !isFinite(i.value)) return false;
        if(/pct|margin/.test(i.key) && i.value===0) return false; // hide empty percent rows
        return true;
      });
    }

    function num(n){ return (n==null||isNaN(n))?'—':Number(n).toLocaleString(); }

    // Pipe size -> stroke style for the true-scale plan (main = thick warm, branch = thin blue).
    function pipeStyle(sz){
      var s = Number(sz)||0;
      if(s>=6) return { color:'#f0a868', w:2.4 };   // cross main (8"/6")
      if(s>=2.5) return { color:'#6ea8ff', w:1.2 };  // branch (2.5")
      return { color:'#8aa0c0', w:1.0 };             // branch downsized (2.0") / drop
    }

    // Render the routed design plan to an SVG at TRUE SCALE: one ft->px factor for BOTH
    // axes (no exaggeration). Heads are dots; pipe segments are lines colored by size.
    function planSVG(plan){
      var b = plan.bounds_ft||{}, W = b.width_ft||0, H = b.height_ft||0;
      if(!(W>0) || !(H>0) || !(plan.segments||[]).length){ return '<div class="note">No routable plan geometry for this floor.</div>'; }
      var pad = 14;                              // px margin
      var maxW = 560;                            // px budget for the panel width
      var k = maxW / W;                          // ft -> px (SAME factor both axes = true scale)
      var svgW = Math.round(W*k + pad*2), svgH = Math.round(H*k + pad*2);
      // map a plan-ft point to svg px (flip y so north is up)
      function px(x){ return pad + (x - b.min_x)*k; }
      function py(y){ return pad + (b.max_y - y)*k; }
      var lines = (plan.segments||[]).map(function(s){
        var st = pipeStyle(s.size_in);
        return '<line x1="'+px(s.x1).toFixed(1)+'" y1="'+py(s.y1).toFixed(1)+'" x2="'+px(s.x2).toFixed(1)+'" y2="'+py(s.y2).toFixed(1)+'" stroke="'+st.color+'" stroke-width="'+st.w+'" stroke-linecap="round" />';
      }).join('');
      var dots = (plan.heads||[]).map(function(h){
        return '<circle cx="'+px(h.x).toFixed(1)+'" cy="'+py(h.y).toFixed(1)+'" r="1.7" fill="#7dd3fc" />';
      }).join('');
      var riser = plan.riser ? '<rect x="'+(px(plan.riser.x)-3.5).toFixed(1)+'" y="'+(py(plan.riser.y)-3.5).toFixed(1)+'" width="7" height="7" fill="#f87171" />' : '';
      // a true-scale 20 ft reference bar (bottom-left)
      var barFt = 20, barPx = barFt*k;
      var bar = '<line x1="'+pad+'" y1="'+(svgH-8)+'" x2="'+(pad+barPx).toFixed(1)+'" y2="'+(svgH-8)+'" stroke="#cbd5e1" stroke-width="1.5" />'
              + '<text x="'+(pad+barPx+5).toFixed(1)+'" y="'+(svgH-5)+'" fill="#94a3b8" font-size="9">20 ft</text>';
      return '<div class="planwrap"><svg viewBox="0 0 '+svgW+' '+svgH+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="True-scale sprinkler plan, floor '+((plan.floor||0)+1)+'">'
           + lines + dots + riser + bar + '</svg></div>'
           + '<div class="leg"><span><span class="sw" style="border-top-color:#f0a868"></span>cross main</span>'
           + '<span><span class="sw" style="border-top-color:#6ea8ff"></span>branch</span>'
           + '<span><span class="dot"></span>head ×'+num(plan.head_count)+'</span>'
           + '<span><span style="display:inline-block;width:8px;height:8px;background:#f87171;vertical-align:middle;margin-right:5px"></span>riser</span></div>';
    }

    // P3 per-room layout: render the richest studio_drawing plate (room rects + heads +
    // routed pipe), true-scale. This is the faithful PER-ROOM placement (vs the uniform
    // /design bbox grid). Returns '' if no studio_drawing so we fall back to /design.
    function studioPlateSVG(p, acceptedGeometry){
      var b = p.bounds_ft||{}, W=b.width_ft||0, H=b.height_ft||0;
      if(!(W>0)||!(H>0)) return '';
      var pad=12, maxW=560, k=maxW/W;
      var svgW=Math.round(W*k+pad*2), svgH=Math.round(H*k+pad*2);
      var X=function(x){return (pad+(x-(b.min_x||0))*k).toFixed(1);};
      var Y=function(y){return (pad+((b.max_y||H)-y)*k).toFixed(1);};
      function point(value){
        if(Array.isArray(value)&&value.length>=2) return [Number(value[0]),Number(value[1])];
        if(value&&Number.isFinite(Number(value.x))&&Number.isFinite(Number(value.y))) return [Number(value.x),Number(value.y)];
        return null;
      }
      function polygonPath(r){
        var poly=r.polygon_ft||r.poly;
        if(!Array.isArray(poly)||poly.length<3) return '';
        var points=poly.map(point);
        if(points.some(function(v){return !v||!Number.isFinite(v[0])||!Number.isFinite(v[1]);})) return '';
        return '<path d="M '+points.map(function(v){return X(v[0])+' '+Y(v[1]);}).join(' L ')+' Z" fill="rgba(74,222,128,.05)" stroke="rgba(74,222,128,.4)" stroke-width="0.6" />';
      }
      var rooms=(p.rooms||[]).map(function(r){
        if(acceptedGeometry){
          var polygon=polygonPath(r);
          if(polygon) return polygon;
        }
        return '<rect x="'+X(r.x0_ft)+'" y="'+Y(r.y1_ft)+'" width="'+((r.x1_ft-r.x0_ft)*k).toFixed(1)+'" height="'+((r.y1_ft-r.y0_ft)*k).toFixed(1)+'" fill="rgba(74,222,128,.05)" stroke="rgba(74,222,128,.4)" stroke-width="0.6" />';
      }).join('');
      var walls=acceptedGeometry?(p.wallRuns||[]).map(function(w){
        var a=point(w.a||w.start||w.p0||{x:w.x0,y:w.y0});
        var z=point(w.b||w.end||w.p1||{x:w.x1,y:w.y1});
        if(!a||!z) return '';
        return '<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(z[0])+'" y2="'+Y(z[1])+'" stroke="rgba(248,113,113,.75)" stroke-width="1" stroke-linecap="round" />';
      }).join(''):'';
      var segs=((p.pipe||{}).segments||[]).map(function(s){
        if(s.x1===s.x2&&s.y1===s.y2) return '';
        var st=pipeStyle(s.size_in);
        return '<line x1="'+X(s.x1)+'" y1="'+Y(s.y1)+'" x2="'+X(s.x2)+'" y2="'+Y(s.y2)+'" stroke="'+st.color+'" stroke-width="'+st.w+'" stroke-linecap="round" />';
      }).join('');
      var dots=(p.heads||[]).map(function(h){ return '<circle cx="'+X(h.x)+'" cy="'+Y(h.y)+'" r="1.6" fill="#7dd3fc" />'; }).join('');
      var riser=(p.pipe&&p.pipe.riser)?'<rect x="'+(X(p.pipe.riser.x)-3.5)+'" y="'+(Y(p.pipe.riser.y)-3.5)+'" width="7" height="7" fill="#f87171" />':'';
      return '<div class="planwrap"><svg viewBox="0 0 '+svgW+' '+svgH+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Per-room layout '+esc(p.label||'')+'">'+walls+rooms+segs+dots+riser+'</svg></div>';
    }
    function renderPendingStudioDrawing(sd, accepted){
      var body=document.getElementById('designBody'), verdict=document.getElementById('designVerdict');
      if(!body) return false;
      var reason=(accepted&&accepted.reason)|| (sd&&sd.accepted_geometry_reason) || 'accepted vector geometry is not available';
      verdict.innerHTML='<span class="pill warn">geometry review pending</span>';
      body.innerHTML='<div class="note"><b>Per-room drawing withheld pending human overlay review.</b> The provisional raster/rectangle drawing is not rendered. '+esc(reason)+'. Accept a stored vector overlay before this drawing can be used.</div>';
      return true;
    }
    function renderStudioDrawing(sd, accepted){
      var body=document.getElementById('designBody'), verdict=document.getElementById('designVerdict');
      if(!body||!sd||sd.available===false||!(sd.plates||[]).length) return false;
      if(!accepted||accepted.available!==true||accepted.accepted_geometry!==true||sd.accepted_geometry!==true){
        return renderPendingStudioDrawing(sd, accepted);
      }
      var p=sd.plates.slice().sort(function(a,b){return (b.head_count||0)-(a.head_count||0);})[0];
      var svg=studioPlateSVG(p, true);
      if(!svg) return false;
      var coh = sd.cohesion_ok;
      verdict.innerHTML = (coh? '<span class="pill ok">cohesion: one system</span>':'<span class="pill warn">disjoint network</span>')
        + ' <span class="pill ok">per-room (P3)</span>';
      var pipe=p.pipe||{};
      body.innerHTML = ''
        + '<div class="stat"><span class="l">Heads (whole building)</span><span class="v">'+num(sd.head_count)+' · '+num(sd.plate_count)+' plates</span></div>'
        + '<div class="stat"><span class="l">Pipe (riser '+esc(sd.k_factor?('K='+sd.k_factor):'')+')</span><span class="v">'+num(Math.round(sd.total_pipe_ft||0))+' ft · '+num(sd.segment_count)+' segs</span></div>'
        + '<div style="margin-top:12px"><div class="note" style="margin-bottom:6px">Per-room true-scale plan — plate <b>'+esc(p.label||'')+'</b> ('+num(p.head_count)+' heads · '+num((pipe.segments||[]).length)+' pipe runs · '+num(Math.round((p.bounds_ft||{}).width_ft))+' × '+num(Math.round((p.bounds_ft||{}).height_ft))+' ft). Heads tile each real room — not a uniform blanket.</div>'
        + svg + '</div>'
        + '<div class="leg"><span><span class="sw" style="border-top-color:#f0a868"></span>cross main</span>'
        + '<span><span class="sw" style="border-top-color:#6ea8ff"></span>branch</span>'
        + '<span><span class="dot"></span>head ×'+num(p.head_count)+'</span>'
        + '<span><span style="display:inline-block;width:8px;height:8px;background:rgba(74,222,128,.5);vertical-align:middle;margin-right:5px"></span>room</span></div>'
        + '<div class="note" style="margin-top:10px"><b>Honest residual:</b> per-room NFPA grid on the extracted rooms; pipe is a coarse routed tree (is_estimate). Brady\'s signed AutoSPRINK calc is the binding post-award number.</div>';
      return true;
    }

    function loadDesign(){
      var body = document.getElementById('designBody');
      var verdict = document.getElementById('designVerdict');
      if(!body) return;
      // Prefer the N3 accepted vector drawing carried on the package. A legacy
      // raster/rectangle studio_drawing is deliberately withheld until its paired
      // accepted_geometry_drawing has passed the overlay gate.
      if(window.__AGD && (window.__AGD.available!==true || window.__AGD.accepted_geometry!==true)){
        renderPendingStudioDrawing(window.__SD, window.__AGD); return;
      }
      if(window.__SD && renderStudioDrawing(window.__SD, window.__AGD)) return;
      api('/design/'+encodeURIComponent(REF)).then(function(r){ return r.ok?r.json():r.json().then(function(e){throw e;}); }).then(function(d){
        if(!d || d.available===false){
          if(d && d.cohesion_failed){ verdict.innerHTML='<span class="pill warn">cohesion failed</span>'; }
          body.innerHTML='<div class="note">No routed design available'+(d&&d.reason?': '+esc(d.reason):'')+'. The design needs an extracted ML footprint to lay heads on.</div>';
          return;
        }
        var s = d.summary||{}, plan = d.plan||{};
        var cohesion = s.cohesion_ok ? '<span class="pill ok">cohesion: one system</span>' : '<span class="pill warn">disjoint network</span>';
        var supplyPill = (s.hydraulics_available===false) ? '' : (s.supply_adequate ? ' <span class="pill ok">supply adequate</span>' : ' <span class="pill warn">supply short</span>');
        verdict.innerHTML = cohesion + supplyPill;
        var sizes = s.footage_by_size || {};
        var sizeRows = Object.keys(sizes).sort(function(a,bb){return Number(bb)-Number(a);}).map(function(sz){
          return '<div class="sizerow"><span>'+esc(sz)+'" pipe</span><span>'+num(Math.round(sizes[sz]))+' ft</span></div>';
        }).join('');
        var html = ''
          + '<div class="stat"><span class="l">Heads (whole building)</span><span class="v">'+num(s.head_count)+' · '+num(s.floors)+' floors</span></div>'
          + '<div class="stat"><span class="l">Pipe (riser '+esc(s.riser_in)+'" · K='+esc(s.k_factor)+')</span><span class="v">'+num(Math.round(s.total_pipe_ft))+' ft</span></div>'
          + sizeRows
          + (s.hydraulics_available!==false
              ? '<div class="stat"><span class="l">Remote-area demand</span><span class="v">'+num(s.demand_gpm)+' gpm @ '+num(s.demand_psi)+' psi</span></div>'
              + '<div class="stat"><span class="l">Supply'+(s.supply_assumed?' (assumed)':'')+' vs demand</span><span class="v">'+num(s.supply_residual_psi)+' psi · margin '+(s.margin_psi>=0?'+':'')+num(s.margin_psi)+' psi</span></div>'
              : '<div class="stat"><span class="l">Remote-area demand</span><span class="v">—</span></div>')
          + '<div class="stat"><span class="l">Cohesion (connected)</span><span class="v">'+s.component_count+' component · '+(s.all_heads_reachable?'all heads reachable':(s.unreachable_head_count+' unreachable'))+'</span></div>'
          + '<div style="margin-top:12px"><div class="note" style="margin-bottom:6px">True-scale plan — floor '+((plan.floor||0)+1)+' ('+num(plan.head_count)+' heads · '+num(plan.segment_count)+' pipe runs · '+num(Math.round((plan.bounds_ft||{}).width_ft))+' × '+num(Math.round((plan.bounds_ft||{}).height_ft))+' ft). No exaggerated scale.</div>'
          + planSVG(plan) + '</div>'
          + '<div class="note" style="margin-top:10px"><b>Honest residual:</b> screening design — uniform NFPA grid + coarse tree route + Hazen-Williams remote-area calc ('+(s.is_estimate?'is_estimate':'binding')+'). The BOM verifies this footage (never reprices; the bid is priced per-head). Brady\'s signed AutoSPRINK calc is the binding post-award number.</div>';
        body.innerHTML = html;
      }).catch(function(err){
        body.innerHTML='<div class="note">Could not load the design'+(err&&(err.detail||err.error)?': '+esc(err.detail||err.error):'')+'.</div>';
      });
    }

    // BOM cross-check panel — each BOM line resolved to a DB-cataloged part with a
    // 3D/SCAD model link + cut-sheet (P5). LOOKUP only: the bid is priced per-head;
    // this BOM verifies the parts + links models, it never reprices.
    function loadBomParts(){
      var body = document.getElementById('bomPartsBody');
      var verdict = document.getElementById('bomPartsVerdict');
      if(!body) return;
      api('/bom/'+encodeURIComponent(REF)+'/parts').then(function(r){ return r.ok?r.json():r.json().then(function(e){throw e;}); }).then(function(d){
        var pr = d.parts_resolution||{};
        verdict.innerHTML = pr.all_resolved
          ? '<span class="pill ok">'+num(pr.resolved_count)+'/'+num(pr.total_count)+' parts cataloged</span>'
          : '<span class="pill warn">'+num(pr.resolved_count)+'/'+num(pr.total_count)+' resolved</span>';
        var rows = (d.lines||[]).map(function(l){
          var c = l.catalog||{};
          var qty = (l.qty!=null? Number(l.qty).toLocaleString():'—')+' '+esc(l.unit||'');
          var awaitTag = c.await_cut_sheet ? ' <span class="pill warn" style="font-size:10px;padding:1px 6px">awaiting cut-sheet</span>' : '';
          var link;
          if(c.cut_sheet_url){
            link = '<a href="'+esc(c.cut_sheet_url)+'" target="_blank" rel="noopener" style="color:var(--hf-color-interactive-text,#9ec3ff)">cut-sheet ↗</a>';
          } else if(c.model_path){
            link = '<span title="'+esc(c.model_path)+'" style="color:#9ec3ff">3D model</span>';
          } else {
            link = '<span class="note" style="opacity:.6">no model yet</span>';
          }
          var part = c.family ? esc(c.family)+' / '+esc(c.subtype) : '<span class="pill warn">no catalog part</span>';
          return '<tr>'
            + '<td>'+esc(l.item||'')+'</td>'
            + '<td style="text-align:right;white-space:nowrap">'+qty+'</td>'
            + '<td>'+part+awaitTag+'</td>'
            + '<td style="text-align:right;white-space:nowrap">'+link+'</td>'
            + '</tr>';
        }).join('');
        body.innerHTML = '<table class="bomtbl"><thead><tr><th>BOM line</th><th style="text-align:right">Qty</th><th>Catalog part</th><th style="text-align:right">Model</th></tr></thead><tbody>'+rows+'</tbody></table>'
          + '<div class="note" style="margin-top:10px"><b>Honest residual:</b> each line resolves to a DB-cataloged part family/subtype with a parametric 3D model; <b>awaiting cut-sheet</b> = the model is a dimensioned envelope until the manufacturer datasheet lands. The catalog VERIFIES the BOM and links the parts — it never reprices (the bid is priced per-head).</div>';
      }).catch(function(err){
        body.innerHTML='<div class="note">Could not load the cataloged BOM'+(err&&(err.detail||err.error)?': '+esc(err.detail||err.error):'')+'.</div>';
      });
    }

    if(!REF){ document.getElementById('root').innerHTML='<div class="note">No bid ref given. Open one from the <a href="/autobid-board.html">Bid Board</a>.</div>'; }
    else api('/package/'+encodeURIComponent(REF)).then(function(r){ return r.json().catch(function(){return {};}).then(function(e){ if(!r.ok){ e.__status=r.status; throw e; } return e; }); }).then(function(p){
      render(p);
    }).catch(function(err){
      var root=document.getElementById('root');
      var status=err&&Number(err.__status||err.status||0);
      if(status===401){
        root.innerHTML='<section class="hf-panel" data-auth-required="true"><div class="phd"><span class="t">Review &amp; Send</span><span class="pill warn">sign in required</span></div><div class="pbd"><div class="note"><b>Sign in to review this bid package.</b> Your reviewer identity is required before source-bound packets or acceptance receipts can be opened. No package data was loaded.</div><a class="btn" href="/login.html?next='+encodeURIComponent(location.pathname+location.search)+'" style="display:inline-block;margin-top:12px;text-decoration:none">Sign in to continue</a></div></section>';
      } else if(status===403){
        root.innerHTML='<section class="hf-panel" data-auth-forbidden="true"><div class="phd"><span class="t">Review &amp; Send</span><span class="pill warn">access denied</span></div><div class="pbd"><div class="note"><b>This bid is not available to your reviewer role.</b> Ask an estimator, admin, or release authorizer to open the appropriate review lane.</div></div></section>';
      } else {
        root.innerHTML='<div class="note">Could not load the package for ref '+esc(REF)+'. '+esc((err&&(err.detail||err.error))||'')+'<br>If the engine is offline: <code>C:/Python312/python.exe engine/api.py</code>.</div>';
      }
    });

    // Honest per-type confidence flag — reads the engine's confidence block
    // (bid-grade vs close-approx + the residual note). Never overstates: anything
    // that is not positively bid-grade renders as close-approx.
    function confidenceBadge(c){
      if(!c || !c.level) return '';
      var grade = (c.level==='bid-grade');
      var label = grade ? 'BID-GRADE' : 'CLOSE-APPROX';
      var bt = c.building_type ? esc(c.building_type) : '';
      var note = esc(c.residual_note||'');
      return '<div class="conf">'
        + '<span class="cb '+(grade?'grade':'approx')+'" title="'+(grade?'Recreated end-to-end from the plans':'Honest starting point - confirm scope post-award')+'">'+label+'</span>'
        + '<div class="cn"><b>'+(grade?'Bid-grade':'Close-approx')+'</b>'+(bt?' &middot; '+bt:'')+' &mdash; '+note+'</div>'
        + '</div>';
    }

    // ---- Ops-center review aggregation (P1) — geometry / layout / reconcile /
    // verification / governance blocks the engine /package already carries. All
    // honest three-state renders: available / pending / unknown, never faked. ----

    // Governance line — proof the geometry/layout/price ops ran through the OpenClaw
    // conductor (durable op-log) + the frozen gate's recorded verdict.
    function governanceLine(g){
      if(!g) return '';
      if(g.governed){
        var vc = (g.verification_converged===true)? ' · verification converged'
               : (g.verification_converged===false)? ' · verification residual' : '';
        return '<div class="note" style="margin:-8px 0 14px;padding:8px 14px;border:1px solid rgba(127,180,255,0.25);border-radius:10px;background:rgba(127,180,255,0.05)">'
          + '⚙ <b>Governed</b> — geometry / layout / price ran through the OpenClaw conductor ('
          + esc((g.ops||[]).join(' · ')) + '), op-log recorded ' + esc(g.ts||'') + ', gate level <b>' + esc(g.level||'—') + '</b>' + vc + '.</div>';
      }
      return '<div class="note" style="margin:-8px 0 14px;padding:8px 14px;border:1px solid var(--hf-line);border-radius:10px">Ungoverned — no conductor record for this package ('+esc(g.error||'')+').</div>';
    }

    // Plan geometry + per-room layout summary panel (sqft / rooms / doors / plates).
    function geometryPanel(p){
      var g = p.geometry||{}, rl = p.room_layout||{}, rb = p.readyBid||{};
      var ok = g.available===true;
      var head = ok? '<span class="pill ok">geometry resolved</span>' : '<span class="pill warn">geometry pending</span>';
      var body;

      } else {
        var plates = g.plates||[], p0 = plates[0]||{};
        var rooms = (g.rooms||{}).total_rooms, doors = (g.doors||{}).total_doors;
        var scale = (g.scale||{});
        body = ''
          + '<div class="stat"><span class="l">Authoritative sqft (priced)</span><span class="v">'+(rb.authoritative_sqft?num(Math.round(rb.authoritative_sqft))+' sq ft':'—')+'</span></div>'
          + '<div class="stat"><span class="l">Extracted footprint (plate 1)</span><span class="v">'+(p0.long_ft?num(Math.round(p0.long_ft))+' × '+num(Math.round(p0.short_ft))+' ft · '+num(Math.round(p0.area_sqft||0))+' sq ft':'—')+'</span></div>'
          + '<div class="stat"><span class="l">Plates / floors</span><span class="v">'+num(plates.length)+' plate(s) · '+(g.n_floors!=null?num(g.n_floors)+' floor(s)':'—')+'</span></div>'
          + '<div class="stat"><span class="l">Rooms segmented</span><span class="v">'+(rooms!=null?num(rooms):'—')+'</span></div>'
          + '<div class="stat"><span class="l">Doors detected</span><span class="v">'+(doors!=null?num(doors):'—')+'</span></div>'
          + '<div class="stat"><span class="l">Auto-read scale</span><span class="v">'+esc(scale.scale_text||'—')+(scale.basis?' ('+esc(scale.basis)+')':'')+'</span></div>'
          + (rl.available? ('<div class="stat"><span class="l">Per-room layout</span><span class="v">'+num(rl.head_count)+' heads · '+num(rl.n_rooms)+' rooms'+(rl.n_open_plates?(' · '+num(rl.n_open_plates)+' open plate(s)'):'')+'</span></div>') : '<div class="stat"><span class="l">Per-room layout</span><span class="v">pending</span></div>')
          + '<div class="note" style="margin-top:10px">Extracted from the plan set (auto-scale + segmentation) — a screening read (is_estimate), not a signed survey.</div>';
      }
      return '<section class="hf-panel mt"><div class="phd"><span class="t">Plan geometry · per-room layout</span>'+head+'</div><div class="pbd">'+body+'</div></section>';
    }

    function densityResolutionPanel(p){
      var d=p.density_resolution||{};
      var resolution=d.resolution||{}, layout=resolution.layout||{}, review=d.review||{};
      var provenance=resolution.density_provenance||{};
      var hydraulic=provenance.hydraulic||resolution.hydraulic||{};
      var hydraulicStatus=(hydraulic.status||'missing').replace(/_/g,' ');
      var hydraulicSource=hydraulic.source||'spec_hazard (CSI Division-21 spec text)';
      var hydraulicDocument=hydraulic.document_id!=null?num(hydraulic.document_id):'-';
      var hydraulicPage=hydraulic.source_page!=null?num(hydraulic.source_page):'-';
      var hydraulicPath=hydraulic.rel_path||'-';
      var qualifiers=Array.isArray(resolution.qualifiers)?resolution.qualifiers.filter(Boolean):[];
      var source=(layout.source||'unresolved').replace(/_/g,' ');
      var status=d.available===true?'available':(review.status||'missing');
      var head=d.available===true?'<span class="pill warn">diagnostic</span>':'<span class="pill warn">'+esc(status.replace(/_/g,' '))+'</span>';
      var observed=(layout.provenance&&layout.provenance.observed_head_count!=null)
        ? ' · observed '+num(layout.provenance.observed_head_count)+' heads' : '';
      var body='<div class="stat"><span class="l">Density source</span><span class="v">'+esc(source)+observed+'</span></div>'
        + '<div class="stat"><span class="l">Layout density</span><span class="v">'+(layout.sqft_per_head!=null?num(layout.sqft_per_head)+' sqft/head':'—')+'</span></div>'
        + '<div class="stat"><span class="l">Hydraulic spec evidence</span><span class="v">'+esc(hydraulicStatus)+' / '+esc(hydraulicSource)+'</span></div>'
        + '<div class="note"><b>Spec source:</b> document '+esc(hydraulicDocument)+' / page '+esc(hydraulicPage)+' / '+esc(hydraulicPath)+'</div>'
        + '<div class="note">This provenance sidecar is diagnostic-only; it does not alter NFPA spacing, pricing, spatial acceptance, model3d grounding, or bid-grade.</div>';
      if(qualifiers.length) body+='<div class="note"><b>Required Division-21 evidence:</b><br>'+qualifiers.map(function(item){return esc(item);}).join('<br>')+'</div>';
      else if(hydraulic.qualifier) body+='<div class="note"><b>Required Division-21 evidence:</b><br>'+esc(hydraulic.qualifier)+'</div>';
      if(d.reason) body+='<div class="note"><b>Residual:</b> '+esc(d.reason.replace(/_/g,' '))+'</div>';
      return '<section class="hf-panel mt" id="densityResolutionPanel"><div class="phd"><span class="t">Density provenance</span>'+head+'</div><div class="pbd">'+body+'</div></section>';
    }

    // Held-out density review worklist. The manifest is truth-free and the
    // receipt endpoint returns only a redacted decision; no answer key or gate
    // promotion is rendered here. Counts are accepted only in a verified
    // estimator/admin session and remain a diagnostic observation.
    var DENSITY_REVIEW_HASH=/^[0-9a-f]{64}$/i;
    function densityHeldoutReviewPanel(){
      return '<section class="hf-panel mt" id="densityHeldoutReviewPanel">'
        + '<div class="phd"><span class="t">Held-out density review</span><span class="pill warn" id="densityHeldoutStatus">verifying reviewer…</span></div>'
        + '<div class="pbd"><div class="note">Source-bound blind worklist for independent density measurement. It shows only the exact FP page and hashes; expected totals are intentionally withheld. A submitted receipt is diagnostic-only and cannot change pricing, geometry, or acceptance.</div>'
        + '<div id="densityHeldoutBody"><div class="note" style="margin-top:10px">Loading truth-free review manifest…</div></div></div></section>';
    }

    // Read-only action manifest: a compact map from each acceptance gate to the
    // source-bound system loop that satisfies it. The endpoint is canonical,
    // but the projection intentionally omits candidate counts, answer keys,
    // and any write capability.
    function acceptanceActionManifest(){
      return '<section class="hf-panel mt review-action-manifest" id="acceptanceActionManifest">'
        + '<div class="phd"><span class="t">Acceptance worklist</span><span class="pill warn" id="acceptanceActionStatus">checking gates…</span></div>'
        + '<div class="pbd"><div class="review-action-intro"><span class="signal" id="acceptanceActionSignal"></span><div class="note"><b>System verification loops.</b> Every acceptance gate is replayed against immutable source evidence by separate primary, independent, and adversarial code paths. No outside reviewer or release signature is required. This list is read-only and never promotes production.</div></div>'
        + '<div class="review-action-grid" id="acceptanceActionGrid"><div class="note">Loading canonical acceptance audit…</div></div>'
        + '<div class="note" id="acceptanceActionFoot" style="margin-top:10px"></div></div></section>';
    }
    function bindAcceptanceActionManifest(){
      var panel=document.getElementById('acceptanceActionManifest');
      var status=document.getElementById('acceptanceActionStatus');
      var signal=document.getElementById('acceptanceActionSignal');
      var grid=document.getElementById('acceptanceActionGrid');
      var foot=document.getElementById('acceptanceActionFoot');
      if(!panel||!status||!grid) return;
      var gates=[
        {key:'fp_semantic_review',label:'FP semantic loop',anchor:'#fpVectorReviewPanel',detail:'Primary vector extraction, independent point verification, and adversarial mutation rejection must agree on the source-bound finished FP plan.'},
        {key:'spatial_review',label:'Spatial overlay loop',anchor:'#spatialVerificationPanel',detail:'Primary vector evidence, independent raster evidence, and adversarial viewport mutations must agree for every registered physical-page viewport.'},
        {key:'density_holdout',label:'Held-out density loop',anchor:'#densityHeldoutReviewPanel',detail:'Primary prediction, independent recomputation, and adversarial truth-invariance scoring must pass the frozen 12% threshold. The estimator panel is diagnostic only.'},
        {key:'n6_scoring',label:'N6 scoring loop',anchor:'/api/autobid/package/'+encodeURIComponent(REF)+'/review-packet',external:true,detail:'Primary candidate evidence, an independent companion component, and adversarial strict scoring must agree on immutable page and point hashes.'}
      ];
      function escStatus(value){ return String(value||'pending').replace(/_/g,' '); }
      function gateFor(audit,key){ return audit&&audit[key] ? audit[key] : null; }
      function render(audit){
        var rows=[];
        gates.forEach(function(item){
          var gate=gateFor(audit,item.key);
          var passed=gate && gate.status==='passed';
          var gateStatus=gate&&gate.status||'pending';
          var count=gate ? '<span class="review-action-count">'+num(gate.accepted_count)+' / '+num(gate.required_count)+'</span>' : '';
          var action=gate&&gate.next_action ? gate.next_action : item.detail;
          rows.push('<article class="review-action" data-acceptance-action="'+item.key+'">'
            + '<div class="review-action-head"><strong>'+esc(item.label)+'</strong><span class="review-action-status '+(passed?'ok':'')+'">'+escStatus(gateStatus)+'</span></div>'
            + '<div class="review-action-detail">'+(count?count+' · ':'')+esc(action)+'</div>'
            + '<a class="review-action-link" href="'+esc(item.anchor)+'"'+(item.external?' target="_blank" rel="noopener"':'')+'>'+(passed?'Review receipt ↗':(item.external?'Open source packet ↗':'Open action ↗'))+'</a>'
            + '</article>');
        });
        grid.innerHTML=rows.join('');
        var production=audit&&audit.production_gate;
        status.className='pill '+(production==='eligible'?'ok':'warn');
        status.textContent=production==='eligible'?'eligible':'production blocked';
        if(signal) signal.className='signal '+(production==='eligible'?'ok':'');
        if(foot){
          var hash=audit&&audit.packet_sha256 ? digest(audit.packet_sha256) : '—';
          foot.textContent='Canonical audit packet '+hash+' · production gate effect: none. Gate state comes only from immutable primary, independent, and adversarial system receipts; this browser cannot promote it.';
        }
      }
      api('/package/'+encodeURIComponent(REF)+'/acceptance-audit').then(function(response){
        return response.json().catch(function(){return {};}).then(function(body){ if(!response.ok){ body.__status=response.status; throw body; } return body; });
      }).then(render).catch(function(err){
        status.className='pill warn'; status.textContent=Number(err&&err.__status)===401?'sign in required':'audit unavailable';
        if(signal) signal.className='signal';
        grid.innerHTML='<div class="note">Canonical acceptance audit unavailable; no action state was inferred. '+esc((err&&(err.detail||err.error))||'')+'</div>';
        if(foot) foot.textContent='No gate was changed.';
      });
    }
    function bindDensityHeldoutReview(){
      var panel=document.getElementById('densityHeldoutReviewPanel');
      var status=document.getElementById('densityHeldoutStatus');
      var body=document.getElementById('densityHeldoutBody');
      if(!panel||!status||!body) return;
      var reviewer=null;
      function setStatus(text,ok){
        status.className='pill '+(ok?'ok':'warn');
        status.textContent=text;
      }
      function pageUrl(binding,page){
        return '/api/autobid/pdf/page?doc='+encodeURIComponent(binding.fp_document_id)+'&page='+encodeURIComponent(page.page_index);
      }
      function renderBindings(manifest){
        var bindings=Array.isArray(manifest.bindings)?manifest.bindings:[];
        var unresolved=Array.isArray(manifest.unresolved_folds)?manifest.unresolved_folds:[];
        if(!bindings.length){
          body.innerHTML='<div class="density-heldout-unresolved">No source-bound held-out density rows are currently available. No review can be recorded.</div>';
          return;
        }
        var rows=bindings.map(function(binding,index){
          var pages=Array.isArray(binding.pages)?binding.pages:[];
          var first=pages[0]||{};
          var options=pages.map(function(page,pageIndex){
            return '<option value="'+pageIndex+'">Physical page '+esc(page.physical_page_number)+' · indexed '+esc(page.page_index)+'</option>';
          }).join('');
          var source=first.page_index!=null?pageUrl(binding,first):'#';
          return '<article class="density-heldout-card" data-density-fold-index="'+index+'">'
            + '<div class="phd" style="padding:0 0 8px;border-bottom:0"><span class="t" style="font-size:12px;color:var(--hf-text)">'+esc(binding.project_group||binding.fold_id)+'</span><span class="pill warn">review only</span></div>'
            + '<div class="density-heldout-grid">'
            + '<div class="stat"><span class="l">Fold</span><span class="v">'+esc(binding.fold_id)+'</span></div>'
            + '<div class="stat"><span class="l">FP sheet</span><span class="v">'+esc(binding.sheet_label||'—')+'</span></div>'
            + '<div class="stat"><span class="l">FP document</span><span class="v">'+num(binding.fp_document_id)+'</span></div>'
            + '<div class="stat"><span class="l">Available pages</span><span class="v">'+num(pages.length)+'</span></div>'
            + '</div>'
            + '<div class="density-heldout-page"><label class="density-heldout-field" style="flex:1 1 220px"><span>Source page to inspect</span><select class="densityHeldoutPage">'+options+'</select></label>'
            + '<a class="density-heldout-source" data-density-source href="'+esc(source)+'" target="_blank" rel="noopener">Open canonical source page ↗</a></div>'
            + '<div class="density-heldout-grid" data-density-page-meta>'
            + '<div class="stat"><span class="l">Physical page</span><span class="v" data-density-physical>'+esc(first.physical_page_number==null?'—':first.physical_page_number)+'</span></div>'
            + '<div class="stat"><span class="l">Rendered page SHA-256</span><span class="v"><code data-density-rendered title="'+esc(first.rendered_page_sha256||'')+'">'+esc(digest(first.rendered_page_sha256))+'</code></span></div>'
            + '<div class="stat"><span class="l">Source PDF SHA-256</span><span class="v"><code title="'+esc(binding.source_pdf_sha256||'')+'">'+esc(digest(binding.source_pdf_sha256))+'</code></span></div>'
            + '<div class="stat"><span class="l">Source status</span><span class="v">'+esc(binding.source_status||'unknown')+'</span></div>'
            + '</div>'
            + '<div class="density-heldout-form">'
            + '<label class="density-heldout-field">Observed heads<input class="densityHeldoutCount" type="number" min="1" max="10000000" step="1" inputmode="numeric" aria-label="Observed sprinkler head count for '+esc(binding.fold_id)+'" placeholder="Count visible heads" /></label>'
            + '<label class="density-heldout-field">Marked overlay SHA-256<input class="densityHeldoutOverlay" type="text" inputmode="text" autocomplete="off" spellcheck="false" pattern="[0-9a-fA-F]{64}" aria-label="Marked overlay SHA-256 for '+esc(binding.fold_id)+'" placeholder="64-character hash of your marked review overlay" /></label>'
            + '<div class="density-heldout-actions"><button class="btn densityHeldoutSubmit" type="button" disabled>Submit observation</button></div>'
            + '</div>'
            + '<div class="density-heldout-actions"><span class="note density-heldout-result" role="status">No observation submitted.</span><span class="pill warn">gate effect: none</span></div>'
            + '</article>';
        }).join('');
        if(unresolved.length) rows+='<div class="density-heldout-unresolved">Unresolved folds remain review-blocked: '+unresolved.map(function(item){return esc(item);}).join(', ')+'</div>';
        body.innerHTML=rows;
        Array.prototype.forEach.call(document.querySelectorAll('[data-density-fold-index]'),function(card){
          var index=Number(card.getAttribute('data-density-fold-index'));
          var binding=bindings[index]||{};
          var pages=Array.isArray(binding.pages)?binding.pages:[];
          var select=card.querySelector('.densityHeldoutPage');
          var source=card.querySelector('[data-density-source]');
          var physical=card.querySelector('[data-density-physical]');
          var rendered=card.querySelector('[data-density-rendered]');
          var count=card.querySelector('.densityHeldoutCount');
          var overlay=card.querySelector('.densityHeldoutOverlay');
          var submit=card.querySelector('.densityHeldoutSubmit');
          var result=card.querySelector('.density-heldout-result');
          function selectedPage(){return pages[Number(select&&select.value)||0]||{};}
          function updatePage(){
            var page=selectedPage();
            if(source) source.href=page.page_index==null?'#':pageUrl(binding,page);
            if(physical) physical.textContent=page.physical_page_number==null?'—':String(page.physical_page_number);
            if(rendered){rendered.textContent=digest(page.rendered_page_sha256); rendered.title=page.rendered_page_sha256||'';}
            updateReady();
          }
          function updateReady(){
            var validCount=!!count && Number.isInteger(Number(count.value)) && Number(count.value)>0 && Number(count.value)<=10000000;
            var validOverlay=!!overlay && DENSITY_REVIEW_HASH.test(String(overlay.value||'').trim());
            var page=selectedPage();
            var validPage=!!page && page.page_index!=null && DENSITY_REVIEW_HASH.test(String(page.rendered_page_sha256||''));
            if(count) count.setAttribute('aria-invalid',validCount?'false':'true');
            if(overlay) overlay.setAttribute('aria-invalid',validOverlay?'false':'true');
            if(submit) submit.disabled=!(window.__densityReviewerAuthorized===true && validCount && validOverlay && validPage && binding.source_status==='available');
          }
          if(select) select.addEventListener('change',updatePage);
          if(count) count.addEventListener('input',updateReady);
          if(overlay) overlay.addEventListener('input',updateReady);
          if(submit) submit.addEventListener('click',function(){
            var page=selectedPage();
            var observed=Number(count&&count.value);
            var overlayHash=String(overlay&&overlay.value||'').trim().toLowerCase();
            if(window.__densityReviewerAuthorized!==true){result.textContent='Verified estimator/admin reviewer session required; no receipt was recorded.'; result.className='note density-heldout-result warn'; return;}
            if(!Number.isInteger(observed)||observed<=0||observed>10000000){result.textContent='Enter a positive integer count visible on the selected source page.'; result.className='note density-heldout-result warn'; updateReady(); return;}
            if(!DENSITY_REVIEW_HASH.test(overlayHash)){result.textContent='Enter the 64-character SHA-256 of the marked review overlay; the source-page hash is not an overlay receipt.'; result.className='note density-heldout-result warn'; updateReady(); return;}
            submit.disabled=true; result.textContent='Submitting source-bound observation…'; result.className='note density-heldout-result';
            api('/heldout-density/review-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
              manifest_sha256:manifest.manifest_sha256,
              binding_id:manifest.binding_id,
              fold_id:binding.fold_id,
              decision:'accepted',
              page_index:page.page_index,
              source_pdf_sha256:binding.source_pdf_sha256,
              rendered_page_sha256:page.rendered_page_sha256,
              overlay_sha256:overlayHash,
              observed_head_count:observed
            })}).then(function(response){return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json};});})
              .then(function(response){
                if(!response.ok) throw new Error((response.json&&(response.json.detail||response.json.error))||'review receipt rejected');
                var receipt=response.json&&response.json.receipt||{};
                if(receipt.observed_head_count!=null||receipt.actual_heads!=null||receipt.answer_key!=null) throw new Error('server returned forbidden truth fields');
                result.textContent='Receipt stored '+digest(receipt.decision_id)+'… · diagnostic-only · gate effect: none';
                result.className='note density-heldout-result ok';
              }).catch(function(error){result.textContent='Density review failed: '+error.message; result.className='note density-heldout-result warn'; updateReady();});
          });
          updatePage();
        });
      }
      window.__densityReviewerAuthorized=false;
      fetch('/api/auth/me',{credentials:'include'}).then(function(response){return response.ok?response.json():null;}).then(function(user){
        reviewer=user||null;
        var role=String((user&&user.role)||'').toLowerCase();
        var allowed=role==='estimator'||role==='admin';
        window.__densityReviewerAuthorized=allowed;
        if(!allowed){setStatus('reviewer not authorized',false); body.innerHTML='<div class="density-heldout-unresolved">A verified estimator/admin session is required to view or submit held-out observations. No review controls are enabled.</div>'; return null;}
        setStatus('reviewer: '+String((user&&(user.name||user.username))||'User')+' · '+role+' · verified',true);
        return api('/heldout-density/review-manifest').then(function(response){return response.ok?response.json():response.json().then(function(error){throw error;});});
      }).then(function(payload){
        if(payload) renderBindings(payload.review_manifest||{});
      }).catch(function(error){
        setStatus('manifest unavailable',false);
        body.innerHTML='<div class="density-heldout-unresolved">Held-out density review is unavailable: '+esc((error&& (error.detail||error.error||error.message))||'unknown error')+'. No observation was recorded.</div>';
      });
    }

    // Head reconcile disclosure — priced whole-building count vs geometry-grounded count.
    function reconcilePanel(hr){
      if(!hr) return '';
      var agree = (hr.delta===0);
      return '<section class="hf-panel mt"><div class="phd"><span class="t">Head reconcile</span>'
        + (agree?'<span class="pill ok">counts agree</span>':'<span class="pill warn">Δ '+num(hr.delta)+' heads</span>')+'</div><div class="pbd">'
        + '<div class="stat"><span class="l">Priced head count</span><span class="v">'+num(hr.head_count_priced)+'</span></div>'
        + '<div class="stat"><span class="l">Geometry-grounded count</span><span class="v">'+num(hr.head_count_geometry)+(hr.geometry_count_source?' <span class="note" style="font-size:11px">('+esc(hr.geometry_count_source.replace(/_/g,' '))+')</span>':'')+'</span></div>'
        + '<div class="stat"><span class="l">Delta</span><span class="v">'+(hr.delta>0?'+':'')+num(hr.delta)+'</span></div>'
        + '<div class="note" style="margin-top:10px">'+esc(hr.reconcile_note||'')+'</div>'
        + '</div></section>';
    }

    // Per-bid verified loop — every ensemble check with its pass/fail/unknown status.
    function verificationPanel(v){
      var head, body;
      if(!v){
        head = '<span class="pill warn">not run</span>';
        body = '<div class="note">The per-bid verification loop did not run for this package (engine build without verification, or the verifier errored). The frozen confidence gate above still applies.</div>';
      } else {
        head = v.converged? '<span class="pill ok">converged</span>' : '<span class="pill warn">did not converge</span>';
        var rows = (v.checks||[]).map(function(c){
          var st = c.status==='pass'? '<span class="pill ok">pass</span>'
                 : c.status==='fail'? '<span class="pill warn" style="background:rgba(252,165,165,0.14);color:#fca5a5;border-color:rgba(252,165,165,0.35)">fail</span>'
                 : '<span class="pill" style="background:rgba(148,163,184,0.12);color:#94a3b8;border:1px solid rgba(148,163,184,0.3)">unknown</span>';
          return '<div class="stat" title="'+esc(c.detail||'')+'"><span class="l">'+esc((c.id||'').replace(/_/g,' '))+'</span><span class="v">'+st+'</span></div>';
        }).join('');
        body = rows
          + (v.residual? '<div class="note" style="margin-top:10px"><b>Residual:</b> '+esc(v.residual)+'</div>'
                       : '<div class="note" style="margin-top:10px">Every present cross-check agrees — the ensemble converged. An <i>unknown</i> leg has absent inputs (e.g. no FP drawing to overlay) and is disclosed, never assumed.</div>');
      }
      return '<section class="hf-panel mt"><div class="phd"><span class="t">Verification — ensemble cross-checks</span>'+head+'</div><div class="pbd">'+body+'</div></section>';
    }

    // Final spatial evidence review. Only these explicitly allowlisted metrics and
    // digests render; filesystem paths and arbitrary gate JSON never enter the DOM.
    var SPATIAL_METRICS = [
      ['reviewed_structural_wall_recall','Reviewed wall recall','pct'],
      ['classified_wall_ink_coverage','Classified wall ink coverage','pct'],
      ['paired_candidate_ink_coverage','Paired candidate ink coverage','pct'],
      ['phantom_room_count','Phantom rooms','num'],
      ['footprint_dimension_error','Footprint dimension error','pct'],
      ['n_rooms','Closed rooms','num'],
      ['retained_wall_count','Retained walls','num'],
      ['classified_structural_evidence_count','Structural evidence','num']
    ];
    function spatialValue(value, format){
      if(value==null || typeof value!=='number' || !isFinite(value)) return '&mdash;';
      return format==='pct' ? (value*100).toFixed(1)+'%' : num(value);
    }
    function digest(value){
      var s=String(value||'');
      if(!s) return '&mdash;';
      return s.length>24 ? s.slice(0,12)+'...'+s.slice(-8) : s;
    }
    function viewportBox(value){
      if(!Array.isArray(value) || value.length!==4 || value.some(function(item){return typeof item!=='number'||!isFinite(item);})) return '';
      return value.map(function(item){return Number(item).toFixed(1);}).join(', ');
    }
    function spatialVerificationPanel(sv){
      if(!sv){
        return '<section class="hf-panel mt" id="spatialVerificationPanel"><div class="phd"><span class="t">Final spatial verification</span><span class="pill warn">unavailable</span></div><div class="pbd"><div class="note">No durable spatial overlay artifact is attached. The spatial badge remains unearned; honest package export is still available.</div></div></section>';
      }
      var status=sv.status||'pending_review';
      var passed=sv.passed===true;
      var head=passed?'<span class="pill ok">accepted</span>':'<span class="pill warn">'+esc(status.replace(/_/g,' '))+'</span>';
      var plates=(sv.plates||[]).map(function(plate,index){
        var page=plate.page||{}, gate=plate.automated_gate||{}, review=plate.review||{};
        var integrity=plate.integrity||{}, source=plate.source||{}, urls=plate.urls||{};
        var renderedHash=String(integrity.rendered_page_sha256||'').trim();
        var priorViewportAttestations=Array.isArray(review.viewport_attestations)?review.viewport_attestations:[];
        var autoPassed=gate.passed===true;
        var metricRows=SPATIAL_METRICS.map(function(spec){
          var value=(plate.metrics||{})[spec[0]];
          if(value==null) return '';
          return '<div class="stat"><span class="l">'+esc(spec[1])+'</span><span class="v">'+spatialValue(value,spec[2])+'</span></div>';
        }).join('');
        var gateReasons=(gate.reasons||[]).map(function(reason){return esc(reason);}).join(' &middot; ');
        var decision=review.current===false?'stale':(review.decision||'pending');
        var viewportProvenance=Array.isArray(plate.viewport_provenance)?plate.viewport_provenance:[];
        var viewportRows=viewportProvenance.map(function(viewport){
          var dims=(viewport.printed_long_ft!=null&&viewport.printed_short_ft!=null)
            ? (' / '+num(viewport.printed_long_ft)+' x '+num(viewport.printed_short_ft)+' ft') : '';
          var transform=Array.isArray(viewport.transform_ft)&&viewport.transform_ft.length===2
            ? (' / transform '+num(viewport.transform_ft[0])+' x '+num(viewport.transform_ft[1])+' ft') : '';
          var sourceBox=viewportBox(viewport.source_bbox_pt);
          var geometryBox=viewportBox(viewport.geometry_bbox_pt);
          var attested=priorViewportAttestations.some(function(item){return item&&item.block_id===viewport.block_id&&item.role===viewport.role;});
          var role=String(viewport.role||'viewport');
          var roleLabel=role==='upper'?'Upper viewport':(role==='lower'?'Lower viewport':role);
          var status=attested?'attested':'needs check';
          var boxes=(sourceBox||geometryBox)
            ? ('source bbox ['+esc(sourceBox||'—')+']'+(geometryBox?' · geometry bbox ['+esc(geometryBox)+']':'')) : 'No registered bbox';
          return '<label class="viewport-review-card spatial-viewport" data-viewport-role="'+esc(role)+'">'
            + (viewportProvenance.length>1?'<input type="checkbox" class="viewport-attestation" data-viewport-block="'+esc(viewport.block_id||'')+'" aria-label="Attest '+esc(role)+' viewport '+esc(viewport.block_id||'')+'"'+(attested?' checked':'')+' />':'')
            + '<span class="viewport-card-body"><span class="viewport-card-title"><span class="viewport-role">'+esc(roleLabel)+'</span> <span class="viewport-id">'+esc(role)+' ('+esc(viewport.block_id||'')+')</span><span class="viewport-status">'+status+'</span></span>'
            + '<span class="viewport-card-detail">'+esc((dims+transform).replace(/^\s*\/\s*/,'')||'Registered composite view')+'<br><code>'+boxes+'</code></span></span></label>';
        }).join('');
        var viewportScope=viewportProvenance.length>1
          ? '<div class="viewport-scope"><strong>Composite scope · '+num(viewportProvenance.length)+' registered views</strong><small><b>Registered source viewports:</b> compare every outlined source view before accepting this plate. A-101 requires both upper and lower attestations; the badge remains pending until each checked box is recorded.</small><div class="viewport-review-grid">'+viewportRows+'</div></div>'
          : (viewportRows?'<div class="viewport-scope"><strong>Single registered view</strong><small>Confirm the source outline and geometry before recording a decision.</small><div class="viewport-review-grid">'+viewportRows+'</div></div>':'');
        var physicalPage=page.physical_page_number==null?'&mdash;':num(page.physical_page_number);
        var pageIndex=page.page_index==null?'&mdash;':num(page.page_index);
        var overlayFrame=urls.overlay_png
          ? '<figure class="spatial-review-frame" data-spatial-review-frame="'+index+'">'
            + '<figcaption>Stored source-PDF pixels + derived walls/rooms composite. Inspect both localized views; red outlines identify source viewports and blue lines are extracted wall centerlines.</figcaption>'

          + '<div class="spatial-digests"><div><span class="note">Source PDF SHA-256</span><br><code title="'+esc(artifact.source_pdf_sha256||'')+'">'+esc(digest(artifact.source_pdf_sha256))+'</code></div>'
          + (artifact.bundle_url?'<div><span class="note">Truth-free bundle</span><br><a href="'+esc(artifact.bundle_url)+'">Open bundle JSON</a></div>':'')

        + '<div class="note" style="margin-bottom:12px">These repeated-vector candidates are estimator-visible review evidence only. They are not sprinkler counts, do not carry answer-key truth, and never clear the spatial or bid-grade gates.</div>'
