    function bindFpMaterialization(docId){
      var body=document.getElementById('fpVectorMaterializeBody');
      if(!body || !docId) return;
      api('/sheets?doc='+encodeURIComponent(docId)).then(function(response){
        return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json,status:response.status};});
      }).then(function(result){
        if(!result.ok) throw new Error((result.json&&(result.json.detail||result.json.error))||('HTTP '+result.status));
        var sheets=Array.isArray(result.json.sheets)?result.json.sheets.filter(function(sheet){
          return sheet && sheet.fp_review===true;
        }):[];
        if(!sheets.length){
          body.innerHTML='<div class="note">No indexed fire-protection sheet is available for this document. No candidate was generated.</div>';
          return;
        }
        body.innerHTML='<div class="fp-materialize-grid">'+sheets.map(function(sheet,index){
          var page=Number(sheet.page_index), physical=Number(sheet.physical_page_number);
          var source=String(sheet.source_pdf_sha256||'').toLowerCase();
          var valid=Number.isInteger(page)&&page>=0&&Number.isInteger(physical)&&physical===page+1&&/^[0-9a-f]{64}$/.test(source);
          return '<article class="review-action fp-materialize-card" data-fp-materialize-index="'+index+'">'
            + '<div class="review-action-head"><strong>'+esc(sheet.sheet_label||('FP page '+physical))+'</strong><span class="review-action-status">physical '+esc(physical)+'</span></div>'
            + '<div class="review-action-detail">Indexed source page '+esc(page)+' · PDF '+esc(digest(source))+' · candidate scan only.</div>'
            + '<button class="btn fpMaterializeButton" data-fp-materialize-index="'+index+'" '+(valid?'':'disabled')+'>Materialize candidate →</button>'
            + '<div class="note fpMaterializeResult" role="status"></div></article>';
        }).join('')+'</div>';
        Array.prototype.forEach.call(document.querySelectorAll('.fpMaterializeButton'),function(button){
          button.addEventListener('click',function(){
            var index=Number(button.getAttribute('data-fp-materialize-index'));
            var sheet=sheets[index]||{};
            var resultNode=button.parentNode.querySelector('.fpMaterializeResult');
            button.disabled=true;
            if(resultNode) resultNode.textContent='Materializing the immutable source-bound overlay…';
            api('/fp-vector-artifacts/materialize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
              document_id:Number(docId), page_index:Number(sheet.page_index),
              physical_page_number:Number(sheet.physical_page_number),
              sheet_label:String(sheet.sheet_label||''),
              source_pdf_sha256:String(sheet.source_pdf_sha256||'').toLowerCase()
            })}).then(function(response){return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json,status:response.status};});})
              .then(function(response){
                if(!response.ok) throw new Error((response.json&&(response.json.detail||response.json.error))||('materialization blocked (HTTP '+response.status+')'));
                if(resultNode) resultNode.textContent='Candidate stored. Reloading the source-bound review panel…';
                location.reload();
              }).catch(function(error){
                if(resultNode) resultNode.textContent='Candidate not generated: '+error.message+' No gate changed.';
                button.disabled=false;
              });
          });
        });
      }).catch(function(error){
        body.innerHTML='<div class="note">Indexed FP sheets unavailable: '+esc(error.message)+'. No candidate was generated.</div>';
      });
    }

    function bindFpVectorReview(fp, docId){
      var artifacts=(fp&&fp.artifacts)||[];
      var visionStatus=document.getElementById('qwenFloorplanStatus');
      if(visionStatus){
        api('/vision/qwen-floorplan/status')
          .then(function(response){return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json};});})
          .then(function(result){
            if(result.ok && result.json.available===true){
              visionStatus.className='pill ok';
              visionStatus.textContent='vision assist: '+(result.json.device==='cuda'?'local GPU':'local CPU');
              visionStatus.title='Qwen candidate generation is available. It remains review-only.';
            }else{
              visionStatus.className='pill warn';
              visionStatus.textContent='vision assist: unavailable here';
              visionStatus.title='Candidate generation is unavailable on this host; deterministic and human review remain active.';
            }
          })
          .catch(function(){
            visionStatus.className='pill warn';
            visionStatus.textContent='vision assist: status unknown';
          });
      }
      bindFpMaterialization(docId);
      artifacts.forEach(function(artifact,index){
        var image=document.querySelector('[data-fp-vector-overlay-index="'+index+'"]');
        var result=document.getElementById('fpVectorResult'+index);
        if(image){
          image.addEventListener('load',function(){
            if(image.naturalWidth>0 && image.naturalHeight>0){
              image.setAttribute('data-overlay-visible','true');
              if(result) result.textContent='Candidate overlay loaded. Count only symbols you can verify against the source sheet.';
            }
          });
          image.addEventListener('error',function(){
            image.removeAttribute('data-overlay-visible');
            if(result) result.textContent='Candidate overlay failed to load; semantic review is unavailable.';
          });
          if(image.complete && image.naturalWidth>0) image.setAttribute('data-overlay-visible','true');
        }
      });
      Array.prototype.forEach.call(document.querySelectorAll('.fpVectorDecision'),function(button){
        button.addEventListener('click',function(){
          var index=Number(button.getAttribute('data-fp-vector-index'));
          var decision=button.getAttribute('data-decision');
          var artifact=artifacts[index]||{};
          var result=document.getElementById('fpVectorResult'+index);
          var image=document.querySelector('[data-fp-vector-overlay-index="'+index+'"]');
          var note=document.getElementById('fpVectorNote'+index);
          if(decision==='accepted' && (!image || image.getAttribute('data-overlay-visible')!=='true')){
            if(result) result.textContent='Accept only after the stored candidate overlay decodes in the browser.';
            return;
          }
          var pointReview=artifact.point_review||null;
          if(decision==='accepted' && (!pointReview || pointReview.decision!=='accepted')){
            if(result) result.textContent='Accept only after an independent blind point receipt is accepted.';
            return;
          }
          Array.prototype.forEach.call(button.parentNode.querySelectorAll('.fpVectorDecision'),function(item){item.disabled=true;});
          if(result) result.textContent='Saving '+decision+' semantic review...';
          api('/fp-vector-artifacts/'+encodeURIComponent(artifact.artifact_id)+'/semantic-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            artifact_id:artifact.artifact_id,
            candidate_id:pointReview?pointReview.candidate_id:'',
            packet_hash:pointReview?pointReview.packet_hash:'',
            point_review_decision_id:pointReview?pointReview.decision_id:'',
            note:note?note.value:'',
            expected_bundle_sha256:(artifact.integrity||{}).bundle_sha256,
            expected_overlay_sha256:(artifact.integrity||{}).overlay_sha256
          })})
            .then(function(response){return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json};});})
            .then(function(response){if(!response.ok) throw new Error((response.json&&(response.json.detail||response.json.error))||'review failed'); location.reload();})
            .catch(function(error){if(result) result.textContent='FP semantic review failed: '+error.message;});
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.fpVectorFamilyDecision'),function(button){
        button.addEventListener('click',function(){
          var index=Number(button.getAttribute('data-fp-vector-index'));
          var artifact=artifacts[index]||{};
          var familyId=button.getAttribute('data-family-id')||'';
          var decision=button.getAttribute('data-decision');
          var image=document.querySelector('[data-fp-vector-overlay-index="'+index+'"]');
          var actions=button.parentNode;
          var result=actions.querySelector('.fpVectorFamilyResult');
          var note=actions.querySelector('.fpVectorFamilyNote');
          var page=artifact.page||{};
          if(!image || image.getAttribute('data-overlay-visible')!=='true'){
            if(result) result.textContent='Review only after the stored candidate overlay decodes in the browser.';
            return;
          }
          Array.prototype.forEach.call(actions.querySelectorAll('.fpVectorFamilyDecision'),function(item){item.disabled=true;});
          if(result) result.textContent='Saving '+decision+' family review...';
          api('/package/'+encodeURIComponent(REF)+'/fp-vector-family-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            artifact_id:artifact.artifact_id,
            page_index:page.page_index,
            physical_page_number:page.physical_page_number,
            family_id:familyId,
            decision:decision,
            bundle_sha256:(artifact.integrity||{}).bundle_sha256,
            overlay_sha256:(artifact.integrity||{}).overlay_sha256,
            note:note?note.value:''
          })})
            .then(function(response){return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json};});})
            .then(function(response){if(!response.ok) throw new Error((response.json&&(response.json.detail||response.json.error))||'family review failed'); location.reload();})
            .catch(function(error){if(result) result.textContent='FP family review failed: '+error.message; Array.prototype.forEach.call(actions.querySelectorAll('.fpVectorFamilyDecision'),function(item){item.disabled=false;});});
        });
      });
      function proxyAutobidUrl(url){
        return String(url||'').indexOf('/api/autobid')===0?String(url):'/api/autobid'+String(url||'');
      }
      function pointDigest(points){
        var ordered=points.slice().sort(function(a,b){return a.x-b.x||a.y-b.y;});
        return crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify({points:ordered}))).then(function(buffer){
          return Array.prototype.map.call(new Uint8Array(buffer),function(byte){return byte.toString(16).padStart(2,'0');}).join('');
        });
      }
      Array.prototype.forEach.call(document.querySelectorAll('.fpPointPacket'),function(button){
        button.addEventListener('click',function(){
          var index=Number(button.getAttribute('data-fp-vector-index'));
          var familyId=button.getAttribute('data-family-id')||'';
          var artifact=artifacts[index]||{};
          var actions=button.parentNode;
          var mount=actions.querySelector('.fpPointReviewMount');
          var result=actions.querySelector('.fpVectorFamilyResult');
          var template=artifact.point_review_packet_url_template||'';
          if(!template){if(result) result.textContent='Blind point packet is not available for this artifact.'; return;}
          var packetUrl=template.replace('{artifact_id}',encodeURIComponent(artifact.artifact_id||'')).replace('{family_id}',encodeURIComponent(familyId));
          button.disabled=true;
          if(result) result.textContent='Loading the source-bound blind page...';
          api(packetUrl.replace(/^\/api\/autobid/,'')).then(function(response){
            return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json};});
          }).then(function(response){
            if(!response.ok) throw new Error((response.json&&response.json.detail)||'point packet unavailable; accept the family first');
            var packet=response.json;
            mount.innerHTML='<div class="fp-point-review"><div class="note">Blind review: source PDF hash <code>'+esc(digest(packet.source_pdf_sha256))+'</code> · physical page '+esc(packet.physical_page_number)+' · no expected count is supplied.</div>'
              +'<div class="note fpPointSourceStatus" role="status">Verifying the fetched source raster against rendered-page hash…</div>'
              +'<div class="fp-point-review-stage"><img class="fpPointPage" alt="Source PDF page for blind sprinkler-head point review" /><canvas class="fpPointCanvas"></canvas></div>'
              +'<div class="fp-point-review-actions"><button class="btn fpPointDecision" data-decision="accepted" disabled>Accept reviewed points</button><button class="btn fpPointDecision" data-decision="rejected" disabled>Reject page</button><span class="note fpPointCount">0 points marked</span></div></div>';
            var stage=mount.querySelector('.fp-point-review-stage');
            var image=mount.querySelector('.fpPointPage');
            var canvas=mount.querySelector('.fpPointCanvas');
            var count=mount.querySelector('.fpPointCount');
            var sourceStatus=mount.querySelector('.fpPointSourceStatus');
            var decisionButtons=mount.querySelectorAll('.fpPointDecision');
            var points=[];
            var sourceVerified=false;
            var sourceUrl=proxyAutobidUrl(packet.source_pdf_page_url);
            var sourceBlobUrl=null;
            var hexDigest=function(buffer){
              return Array.prototype.map.call(new Uint8Array(buffer),function(byte){return byte.toString(16).padStart(2,'0');}).join('');
            };
            var redraw=function(){
              if(!image.naturalWidth) return;
              canvas.width=image.naturalWidth; canvas.height=image.naturalHeight;
              var ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
              ctx.fillStyle='#f0a868'; ctx.strokeStyle='#24170b'; ctx.lineWidth=Math.max(2,canvas.width/700);
              points.forEach(function(point){
                var px=point.x/packet.page_width_pt*canvas.width;
                var py=point.y/packet.page_height_pt*canvas.height;
                ctx.beginPath(); ctx.arc(px,py,Math.max(5,canvas.width/180),0,Math.PI*2); ctx.fill(); ctx.stroke();
              });
              if(count) count.textContent=points.length+' point'+(points.length===1?'':'s')+' marked';
            };
            image.addEventListener('load',redraw);
            fetch(sourceUrl,{credentials:'include',cache:'no-store'}).then(function(response){
              if(!response.ok) throw new Error('source raster fetch returned HTTP '+response.status);
              return response.arrayBuffer();
            }).then(function(buffer){
              if(!window.crypto || !window.crypto.subtle) throw new Error('browser SHA-256 support is unavailable');
              return window.crypto.subtle.digest('SHA-256',buffer).then(function(digestBuffer){
                var actual=hexDigest(digestBuffer);
                if(actual!==String(packet.rendered_page_sha256||'').toLowerCase()) throw new Error('rendered source-page SHA-256 mismatch');
                sourceVerified=true;
                Array.prototype.forEach.call(decisionButtons,function(item){item.disabled=false;});
                if(sourceStatus){sourceStatus.className='note fpPointSourceStatus ok'; sourceStatus.textContent='Source raster verified · rendered-page SHA-256 '+digest(actual)+'…';}
                // Display the exact bytes that were hashed; do not fetch a second
                // mutable copy between verification and point placement.
                sourceBlobUrl=URL.createObjectURL(new Blob([buffer],{type:'image/png'}));
                image.src=sourceBlobUrl;
              });
            }).catch(function(error){
              sourceVerified=false;
              if(sourceStatus){sourceStatus.className='note fpPointSourceStatus warn'; sourceStatus.textContent='Blind review unavailable: '+error.message+'. Decision controls remain disabled.';}
            });
            canvas.addEventListener('click',function(event){
              if(!sourceVerified || !image.naturalWidth || !image.naturalHeight) return;
              var rect=canvas.getBoundingClientRect();
              points.push({x:(event.clientX-rect.left)/rect.width*packet.page_width_pt,y:(event.clientY-rect.top)/rect.height*packet.page_height_pt});
              redraw();
            });
            Array.prototype.forEach.call(mount.querySelectorAll('.fpPointDecision'),function(decisionButton){
              decisionButton.addEventListener('click',function(){
                var decision=decisionButton.getAttribute('data-decision');
                if(!sourceVerified){if(result) result.textContent='Verify the canonical rendered source page before submitting a decision.'; return;}
                if(decision==='accepted' && !points.length){if(result) result.textContent='Mark at least one clearly visible sprinkler head before accepting.'; return;}
                Array.prototype.forEach.call(mount.querySelectorAll('.fpPointDecision'),function(item){item.disabled=true;});
                var selected=decision==='accepted'?points:[];
                Promise.resolve().then(function(){
                  return api('/fp-vector-artifacts/'+encodeURIComponent(artifact.artifact_id)+'/point-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
                    packet_hash:packet.packet_hash, artifact_id:artifact.artifact_id, candidate_id:packet.candidate_id,
                    family_id:familyId, points:selected, decision:decision,
                    note:'Estimator point review from source-bound blind page'
                  })});
                }).then(function(response){return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json};});})
                  .then(function(response){if(!response.ok) throw new Error((response.json&&response.json.detail)||'point review failed'); if(result) result.textContent='Canonical point receipt stored: '+response.json.decision_id.slice(0,12)+'…';})
                  .catch(function(error){if(result) result.textContent='Point review failed: '+error.message; Array.prototype.forEach.call(mount.querySelectorAll('.fpPointDecision'),function(item){item.disabled=false;});});
              });
            });
            if(result) result.textContent='Source-bound blind page ready. Mark only symbols you can verify.';
          }).catch(function(error){if(result) result.textContent='Blind point packet failed: '+error.message; button.disabled=false;});
        });
      });
    }

      function bindSpatialReviewerContext(){
      var chip=document.getElementById('spatialReviewerContext');
      window.__spatialReviewerAuthorized=false;
      if(!chip) return;
      fetch('/api/auth/me',{credentials:'include'})
        .then(function(response){return response.ok?response.json():null;})
        .then(function(user){
          var role=String((user&&user.role)||'').toLowerCase();
          var allowed=role==='estimator'||role==='admin';
          window.__spatialReviewerAuthorized=allowed;
          chip.className='pill '+(allowed?'ok':'warn');
          chip.textContent=allowed
            ? 'reviewer: '+String((user&&(user.name||user.username))||'User')+' · '+role+' · verified'
            : 'reviewer session not authorized';
          if(window.__spatialReviewRefresh) window.__spatialReviewRefresh();
        })
        .catch(function(){
          window.__spatialReviewerAuthorized=false;
          chip.className='pill warn';
          chip.textContent='reviewer session unavailable';
          if(window.__spatialReviewRefresh) window.__spatialReviewRefresh();
        });
      }

      function bindSpatialReview(sv){
      var plates=(sv&&sv.plates)||[];
      var refreshers=[];
      window.__spatialReviewerAuthorized=false;
      plates.forEach(function(plate,index){
        var gate=plate.automated_gate||{};
        var image=document.querySelector('[data-spatial-overlay-index="'+index+'"]');
        var accept=document.querySelector('.spatialDecision[data-plate-index="'+index+'"][data-decision="accepted"]');
        var reject=document.querySelector('.spatialDecision[data-plate-index="'+index+'"][data-decision="rejected"]');
        var result=document.getElementById('spatialResult'+index);
        if(!image || !accept) return;
        function markVisible(){
          if(image.naturalWidth<=0 || image.naturalHeight<=0) return markBroken();
          accept.setAttribute('data-overlay-visible','true');
          var renderedHash=String((plate.integrity||{}).rendered_page_sha256||'').trim();
          var viewportReady=Array.prototype.every.call(
            document.querySelectorAll('[data-spatial-artifact="'+plate.artifact_id+'"] .viewport-attestation'),
            function(item){return item.checked;});
          var reviewerReady=window.__spatialReviewerAuthorized===true;
          accept.disabled=gate.passed!==true || !viewportReady || renderedHash.length!==64 || !reviewerReady;
          if(reject) reject.disabled=renderedHash.length!==64 || !reviewerReady;
          accept.title=!reviewerReady?'Verified estimator/admin reviewer session required before recording a decision':(gate.passed!==true?'Automated overlay gate must pass before acceptance':(renderedHash.length!==64?'Canonical rendered source-page hash is unavailable; acceptance is blocked':(viewportReady?'Stored overlay loaded and all source viewports attested':'Inspect and check every registered source viewport before acceptance')));
          if(result) result.textContent='Stored overlay loaded. Review the pixels before recording a decision.';
        }
        function markBroken(){
          accept.removeAttribute('data-overlay-visible');
          accept.disabled=true;
          if(reject) reject.disabled=true;
          accept.title='Stored overlay could not be displayed; acceptance is unavailable';
          if(result) result.textContent='Stored overlay failed to load or decode. Acceptance remains disabled.';
        }
        image.addEventListener('load',markVisible);
        image.addEventListener('error',markBroken);
        Array.prototype.forEach.call(document.querySelectorAll('[data-spatial-artifact="'+plate.artifact_id+'"] .viewport-attestation'),function(item){
          item.addEventListener('change',markVisible);
        });
        if(image.complete) (image.naturalWidth>0?markVisible:markBroken)();
        refreshers.push(markVisible);
      });
      window.__spatialReviewRefresh=function(){refreshers.forEach(function(refresh){refresh();});};
      Array.prototype.forEach.call(document.querySelectorAll('.spatialDecision'),function(button){
        button.addEventListener('click',function(){
          var index=Number(button.getAttribute('data-plate-index'));
          var decision=button.getAttribute('data-decision');
          var plate=plates[index]||{}, gate=plate.automated_gate||{}, integrity=plate.integrity||{};
          var renderedHash=String(integrity.rendered_page_sha256||'').trim();
          if(window.__spatialReviewerAuthorized!==true){
            var unauthorizedResult=document.getElementById('spatialResult'+index);
            if(unauthorizedResult) unauthorizedResult.textContent='Verified estimator/admin reviewer session required; no decision was recorded.';
            return;
          }
          if(renderedHash.length!==64){
            var unavailableResult=document.getElementById('spatialResult'+index);
            if(unavailableResult) unavailableResult.textContent='Canonical rendered source-page hash is unavailable; no spatial decision can be recorded.';
            return;
          }
          if(decision==='accepted' && (gate.passed!==true || button.getAttribute('data-overlay-visible')!=='true')) return;
          var note=document.getElementById('spatialNote'+index);
          var recallInput=document.getElementById('spatialRecall'+index);
          var phantomInput=document.getElementById('spatialPhantoms'+index);
          var result=document.getElementById('spatialResult'+index);
          var recall=recallInput&&recallInput.value!==''?Number(recallInput.value):null;
          var phantoms=phantomInput&&phantomInput.value!==''?Number(phantomInput.value):null;
          var viewportInputs=document.querySelectorAll('[data-spatial-artifact="'+plate.artifact_id+'"] .viewport-attestation');
          var viewportReady=Array.prototype.every.call(viewportInputs,function(item){return item.checked;});
          if(decision==='accepted' && viewportInputs.length && !viewportReady){
            if(result) result.textContent='Acceptance requires an independent visual check of every registered source viewport.';
            return;
          }
          if(decision==='accepted' && (recall==null || !isFinite(recall) || recall<0.90 || recall>1 || phantoms!==0)){
            if(result) result.textContent='Acceptance requires reviewed wall recall from 0.90 to 1.00 and exactly zero phantom rooms.';
            return;
          }
          var siblings=button.parentNode.querySelectorAll('.spatialDecision');
          Array.prototype.forEach.call(siblings,function(item){item.disabled=true;});
          if(result) result.textContent='Saving '+decision+' review...';
          var payload={
            artifact_id:plate.artifact_id,
            decision:decision,
            note:note?note.value:'',
            reviewed_structural_wall_recall:decision==='accepted'?recall:null,
            phantom_room_count:decision==='accepted'?phantoms:null,
            viewport_attestations:decision==='accepted'?Array.prototype.map.call(plate.viewport_provenance||[],function(viewport){return {
              block_id:viewport.block_id, role:viewport.role, source_bbox_pt:viewport.source_bbox_pt
            };}):null,
            expected_png_sha256:integrity.png_sha256,
            expected_manifest_sha256:integrity.manifest_sha256,
            expected_rendered_page_sha256:integrity.rendered_page_sha256
          };
          api('/package/'+encodeURIComponent(REF)+'/spatial-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
            .then(function(response){return response.json().catch(function(){return {};}).then(function(json){return {ok:response.ok,json:json};});})
            .then(function(response){
              if(!response.ok) throw new Error((response.json&&(response.json.detail||response.json.error))||'review failed');
              location.reload();
            })
            .catch(function(error){
              if(result) result.textContent='Spatial review failed: '+error.message;
              Array.prototype.forEach.call(siblings,function(item){
                item.disabled=item.getAttribute('data-decision')==='rejected'
                  ? renderedHash.length!==64 || window.__spatialReviewerAuthorized!==true
                  : (gate.passed!==true || item.getAttribute('data-overlay-visible')!=='true' || renderedHash.length!==64 || window.__spatialReviewerAuthorized!==true);
              });
            });
        });
      });
    }

    function operationsFlowRail(p){
      var ready=(p&&p.readyBid)||{};
      var verification=(p&&p.verification)||{};
      var sent=(p&&p.sent_status)||{};
      var intakeState=ready.job_name||ready.head_count!=null?'complete':'pending';
      var verificationState=verification.converged===true?'complete':'current';
      var exportState=sent.transmission_confirmed===true?'complete':'pending';
      return '<section class="ops-flow-rail" aria-label="HaloFire operations flow" data-active="review">'
        + '<article class="ops-flow-step '+(intakeState==='complete'?'complete':'')+'"><span class="flow-k">01 · Intake</span><span class="flow-v">'+(intakeState==='complete'?'Package built':'Package pending')+'</span><span class="flow-note">Source, scope, and pricing inputs are bound.</span></article>'
        + '<article class="ops-flow-step current"><span class="flow-k">02 · Review</span><span class="flow-v">Human review</span><span class="flow-note">Inspect source-bound overlays, counts, and qualifiers.</span></article>'
        + '<article class="ops-flow-step '+(verificationState==='complete'?'complete':'current')+'"><span class="flow-k">03 · Verify</span><span class="flow-v">'+(verificationState==='complete'?'Checks converged':'Receipts required')+'</span><span class="flow-note">Independent evidence stays separate from candidate tooling.</span></article>'
        + '<article class="ops-flow-step '+(exportState==='complete'?'complete':'')+'"><span class="flow-k">04 · Export</span><span class="flow-v">'+(exportState==='complete'?'Transmission confirmed':'Manual export')+'</span><span class="flow-note">Export stages the package; sending remains explicit.</span></article>'
        + '</section>';
    }

    function render(p){
      var rb = p.readyBid||{}, cd = p.charts_data||{}, m3 = p.model3d||{};
      var quals = p.qualifiers||[];
      var conf = p.confidence||null;
      // P3 per-room layout carried on the package (preferred plan source for loadDesign).
      window.__SD = p.studio_drawing || null;
      window.__AGD = p.accepted_geometry_drawing || null;
      // doc id for the 3D viewer + Bluebeam draw links (package ref is the doc when ?by=doc).
      // Use only the canonical resolved plan-set source for drawing/3D. A priced
      // workbook or package ref is not a drawable PDF and must never be a fallback.
      var docId = p.geometry_document_id || (p.meta&&p.meta.geometry_document_id) || null;
      var navLinks = docId
        ? '<a class="btn" href="/autosprink.html?doc='+encodeURIComponent(docId)+'" style="text-decoration:none;margin-left:8px">⬡ Open 3D model</a>'
          + '<a class="btn" href="/autobid-draw.html?doc='+encodeURIComponent(docId)+'" style="text-decoration:none;margin-left:8px">✎ Open drawing</a>'
        : '';
      var sentStatus = p.sent_status || {};
      var sent = sentStatus.transmission_confirmed === true;
      var exportedPending = sentStatus.transmission_status === 'exported_manual_transmission_pending';
      var heads = rb.head_count, bomHeads = rb.bom_head_count;
      var agree = rb.heads_agree!==false && rb.cross_check_pass!==false;

      var costItems = chartItems(cd.cost_breakdown);
      var covItems = chartItems(cd.coverage);
      var pphItems = chartItems(cd.dollars_per_head);

      // massing / floors honesty
      var floors = m3.floors||rb.floors||null;
      var prov = m3.floor_provenance||{};
      var floorPills = '';
      if(floors){
        for(var f=1; f<=floors; f++){
          var real = (prov[f]==='ml'||prov[f]==='real'||prov[f]==='extracted'|| (f===1 && m3.geometry_grounded));
          floorPills += '<div class="floorpill '+(real?'real':'placeholder')+'"><span>Floor '+f+'</span><span>'+(real?'real geometry':'massing')+'</span></div>';
        }
      }

      function bindSpatialReviewFrames(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-spatial-zoom]'),function(slider){
          var index=slider.getAttribute('data-spatial-zoom');
          var frame=document.querySelector('[data-spatial-review-frame="'+index+'"]');
          var image=frame&&frame.querySelector('.spatial-overlay');
          var output=document.getElementById('spatialZoomValue'+index);
          if(!frame||!image) return;
          var update=function(){
            var percent=Math.max(100,Math.min(300,Number(slider.value)||100));
            image.style.width=percent+'%';
            if(output) output.value=percent+'%';
            if(output) output.textContent=percent+'%';
          };
          slider.addEventListener('input',update);
          update();
        });
      }

      var html = ''
      + '<div class="head">'
      +   '<div><div class="jn">'+esc(rb.job_name||('Bid '+REF))+'</div><div class="loc">'+esc(rb.location||rb.builder||'')+' · '+(rb.authoritative_sqft?Number(rb.authoritative_sqft).toLocaleString()+' sq ft':'')+'</div></div>'
      +   '<div class="spacer"></div>'
      +   '<div class="headline"><div class="big">'+usd(rb.total)+'</div><div class="band">'+ (rb.in_band===false?'<span class="pill warn">outside corpus band</span>':'<span class="pill ok">in corpus band</span>') +' · $'+Math.round(rb.cost_per_head||0)+'/head</div>'
      +     '<div style="margin-top:8px">'+navLinks+'</div></div>'
      + '</div>'

      + confidenceBadge(conf)
      + governanceLine(p.governance)

      + operationsFlowRail(p)
      + '<div class="cols">'
      // LEFT: numbers + charts + massing
      +   '<div>'
      +     '<section class="hf-panel"><div class="phd"><span class="t">Cross-check</span>'+(agree?'<span class="pill ok">heads agree</span>':'<span class="pill warn">review heads</span>')+'</div><div class="pbd">'
      +       '<div class="stat"><span class="l">Head count (takeoff)</span><span class="v">'+(heads!=null?Number(heads).toLocaleString():'—')+'</span></div>'
      +       '<div class="stat"><span class="l">Head count (BOM)</span><span class="v">'+(bomHeads!=null?Number(bomHeads).toLocaleString():'—')+'</span></div>'
      +       '<div class="stat"><span class="l">Riser / backflow</span><span class="v">'+(rb.riser_size_in||'—')+'" / '+(rb.backflow_size_in||'—')+'"</span></div>'
      +       '<div class="stat"><span class="l">Anomaly</span><span class="v">'+esc(rb.anomaly_state||'—')+(rb.self_corrected?' (self-corrected)':'')+'</span></div>'
      +     '</div></section>'

      // P1 ops-center review aggregation — geometry / reconcile / verification blocks
      // straight off the /package manifest (all honest three-state, never faked).
      +     geometryPanel(p)
      +     densityResolutionPanel(p)
      +     densityHeldoutReviewPanel()
      +     acceptanceActionManifest()
      +     spatialVerificationPanel(p.spatial_verification)
      +     fpVectorReviewPanel(p.fp_vector_review, docId)
      +     reconcilePanel(p.head_reconcile)
      +     verificationPanel(p.verification)

      +     (costItems.length? '<section class="hf-panel mt"><div class="phd"><span class="t">Cost breakdown</span></div><div class="pbd">'+bars(costItems, usd)+'</div></section>':'')
      +     (covItems.length? '<section class="hf-panel mt"><div class="phd"><span class="t">Coverage</span></div><div class="pbd">'+bars(covItems)+'</div></section>':'')
      +     (pphItems.length? '<section class="hf-panel mt"><div class="phd"><span class="t">$/head vs history</span></div><div class="pbd">'+bars(pphItems, function(v){return '$'+Math.round(v);})+'</div></section>':'')

      +     '<section class="hf-panel mt"><div class="phd"><span class="t">3D massing</span>'+(m3.geometry_grounded?'<span class="pill ok">floor 1 real</span>':'')+'</div><div class="pbd">'
      +       (floorPills? '<div class="massing">'+floorPills+'</div><div class="note" style="margin-top:10px">Footprint '+(m3.footprint_bbox_ft?esc(m3.footprint_bbox_ft.join? m3.footprint_bbox_ft.join(' × ') : JSON.stringify(m3.footprint_bbox_ft))+' ft':'—')+'. <b>Honest residual:</b> floor 1 is real extracted geometry; floors 2+ repeat as massing until per-floor extraction lands.</div>' : '<div class="note">Massing summary unavailable.</div>')
      +     '</div></section>'

      // Sprinkler design — the code-correct layout + pipe + calc, true-scale plan view.
      // Populated async by loadDesign() so the package render is never blocked on it.
      +     '<section class="hf-panel mt" id="designPanel"><div class="phd"><span class="t">Sprinkler design</span><span id="designVerdict"></span></div><div class="pbd" id="designBody"><div class="note">Loading the routed design…</div></div></section>'

      // BOM cross-check — every BOM line resolved to a DB-cataloged part + 3D model
      // (P5). Populated async by loadBomParts(); the bid stays priced per-head.
      +     '<section class="hf-panel mt" id="bomPartsPanel"><div class="phd"><span class="t">BOM cross-check — cataloged parts</span><span id="bomPartsVerdict"></span></div><div class="pbd" id="bomPartsBody"><div class="note">Resolving BOM lines to catalog parts…</div></div></section>'
      +   '</div>'

      // RIGHT: the outgoing proposal + qualifiers
      +   '<div>'
      +     '<section class="hf-panel"><div class="phd"><span class="t">Outgoing proposal (draft)</span><span class="hf-chip"><span class="gl"></span> corpus format</span></div><div class="pbd">'
      +       '<iframe class="pdf" src="/api/autobid/proposal/'+encodeURIComponent(REF)+'" title="proposal"></iframe>'
      +       '<div class="note" style="padding:8px 0 0"><a href="/api/autobid/proposal/'+encodeURIComponent(REF)+'" target="_blank" rel="noopener" style="color:var(--hf-color-interactive-text,#9ec3ff)">Open proposal PDF ↗</a> — the outgoing cover sheet in Halo Fire\'s corpus format.</div>'
      +     '</div></section>'
      +     '<section class="hf-panel mt"><div class="phd"><span class="t">Qualifiers / assumptions ('+quals.length+')</span></div><div class="pbd">'
      +       '<div class="note" style="margin-bottom:8px">Auto-applied from the corpus + rules. Edit any line before sending; these ride the bid as exclusions/assumptions.</div>'
      +       '<ul class="ql" id="qlist">'+ quals.map(function(q,i){
                var text = (typeof q==='string')? q : (q.text||q.qualifier||q.note||JSON.stringify(q));
                var src = (q&&q.source)? q.source : '';
                return '<li><span class="src">'+esc(src)+'</span><textarea data-i="'+i+'">'+esc(text)+'</textarea></li>';
              }).join('') +'</ul>'
      +     '</div></section>'
      +   '</div>'
      + '</div>'

      + '<div class="sendbar hf-card">'
      +   '<div class="summary">'+(sent? 'Transmission confirmed ('+esc((p.sent_status&&p.sent_status.sent_at)||'')+').' : (exportedPending ? 'Package exported — manual transmission still pending; files or external delivery are not confirmed.' : 'Reviewing-and-sending is the one human gate. Export stages the package for confirmed transmission — it does not auto-email the client.'))+'</div>'
      +   '<button class="btn" onclick="window.location=\'/autobid-board.html\'">Back to board</button>'
      +   '<button class="btn send" id="sendBtn"'+(sent?' disabled':'')+'>'+(sent?'Transmission confirmed ✓':(exportedPending?'Re-export package →':'Export bid package →'))+'</button>'
      + '</div>';

      document.getElementById('root').innerHTML = html;

      // Fetch + render the unified sprinkler design (heads + routed pipe + hydraulics)
      // into its panel — TRUE-SCALE 2D plan, no exaggeration. Non-blocking.
      loadDesign();

      // Resolve every BOM line to a DB-cataloged part with a 3D model link. Non-blocking.
      loadBomParts();

      // The overlay review controls only the spatial badge. Export remains independent.
      bindSpatialReview(p.spatial_verification);
      bindSpatialReviewerContext();
      bindSpatialReviewFrames();
      bindFpVectorReview(p.fp_vector_review, docId);
      bindDensityHeldoutReview();
      bindAcceptanceActionManifest();

      var btn = document.getElementById('sendBtn');
      if(btn && !sent){
        btn.addEventListener('click', function(){
          btn.disabled = true; btn.textContent = 'Sending…';
          var edited = Array.prototype.map.call(document.querySelectorAll('#qlist textarea'), function(t){ return t.value; });
          api('/package/'+encodeURIComponent(REF)+'/send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ edited_qualifiers: edited }) })
            .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ return {ok:r.ok, j:j}; }); })
            .then(function(res){
              if(res.ok){
                btn.textContent = 'Sent ✓';
                var ss = (res.j && res.j.sent_status) || {};
                var b = ss.bundle || {};
                var dr = b.draft || {};
                var files = [];
                if(ss.proposal_pdf || b.proposal_pdf) files.push('proposal PDF');
                if(ss.cover_sheet || b.cover_sheet_xlsx) files.push('Excel cover sheet');
                var where = ss.export_path || b.dir || 'out/sent/'+REF;
                var draftMsg = (dr && dr.transmitted === false)
                  ? ' An email draft is STAGED (to ' + esc((dr.to && (dr.to.name||dr.to.company)) || 'the GC')
                      + (dr.needs_recipient_email ? ', recipient email needed' : '')
                      + ', ' + (dr.attachment_count||files.length) + ' attachments) — not sent. Live email needs SMTP credentials.'
                  : ' An email draft is staged — not sent.';
                document.querySelector('.sendbar .summary').textContent =
                  'Package exported to ' + esc(where) + (files.length? ' ('+files.join(' + ')+').' : '.') + draftMsg;
              }
              else { btn.disabled=false; btn.textContent='Send bid package →'; document.querySelector('.sendbar .summary').textContent='Send failed: '+esc((res.j&&(res.j.detail||res.j.error))||'unknown'); }
            })
            .catch(function(e){ btn.disabled=false; btn.textContent='Send bid package →'; document.querySelector('.sendbar .summary').textContent='Send failed: '+esc(e.message); });
        });
      }
    }
  </script>
</body>
