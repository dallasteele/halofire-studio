<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halo Fire - Secure Client Access</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#07080a;
  --panel:rgba(255,255,255,0.09);
  --panel-strong:rgba(255,255,255,0.14);
  --stroke:rgba(255,255,255,0.22);
  --stroke-soft:rgba(255,255,255,0.12);
  --text:#f7f7f4;
  --muted:#b8b8b2;
  --subtle:#85857f;
  --fire:#e32621;
  --fire-soft:rgba(227,38,33,0.34);
  --gold:#f7d516;
  --amber:#f6a85d;
  --phi:1.618;
  --glass-blur:24px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
}
html,body{width:100%;min-height:100%;margin:0;background:#050505;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at 33% 42%,rgba(247,213,22,0.16),transparent 23%),
    radial-gradient(circle at 69% 38%,rgba(227,38,33,0.18),transparent 30%),
    radial-gradient(circle at 77% 68%,rgba(255,255,255,0.05),transparent 22%),
    linear-gradient(125deg,#050505 0%,#11100e 44%,#090302 100%);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:linear-gradient(90deg,rgba(0,0,0,0.2),transparent 36%,rgba(0,0,0,0.55));
  pointer-events:none;
}
button,input{font:inherit}
img{user-select:none;-webkit-user-drag:none}
.page{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,4vw,58px)}
.brand-lockup{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
.brand-mark-small{width:74px;height:40px;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,0.38))}
.brand-copy{display:grid;gap:2px}
.brand-copy strong{font-size:14px;letter-spacing:0.08em;text-transform:uppercase}
.brand-copy span{font-size:11px;color:var(--muted)}
.top-actions{color:rgba(255,255,255,0.62);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.btn-sign,.btn-main,.submit-btn{
  border:1px solid rgba(255,255,255,0.2);
  background:linear-gradient(135deg,#ffbd77,#f08f48);
  color:#130b07;
  border-radius:8px;
  cursor:pointer;
  box-shadow:0 20px 48px rgba(240,143,72,0.18);
}
.portal{
  width:min(1376px,calc(100vw - 40px));
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(560px,1.618fr) minmax(360px,0.92fr);
  align-items:center;
  gap:clamp(34px,5.2vw,92px);
  min-height:calc(100vh - 94px);
  padding:24px 0 58px;
}
.brand-stage{
  position:relative;
  min-height:min(70vh,704px);
  overflow:visible;
  isolation:isolate;
}
.brand-stage::before{
  content:"";
  position:absolute;
  inset:-18%;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(circle at 50% 54%,rgba(247,213,22,0.18),rgba(227,38,33,0.16) 22%,rgba(6,7,9,0) 58%);
  filter:blur(34px);
}
.brand-stage::after{
  content:"";
  position:absolute;
  inset:12% 8%;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,255,255,0.08),rgba(255,255,255,0) 58%);
}
.halo-three-canvas{
  position:absolute;
  inset:-4%;
  z-index:0;
  width:108%;
  height:108%;
  display:block;
}
.hero-logo-fallback{
  position:absolute;
  left:50%;
  top:50%;
  z-index:0;
  width:min(74%,560px);
  height:auto;
  opacity:0.88;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 22px 38px rgba(0,0,0,0.55)) drop-shadow(0 0 30px rgba(227,38,33,0.2));
  transition:opacity .4s ease;
  pointer-events:none;
}
.brand-stage.scene-ready .hero-logo-fallback{opacity:0}
.renderer-badge{display:none}
.login{
  position:relative;
  z-index:3;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.24);
  border-radius:26px;
  padding:34px;
  background:
    linear-gradient(142deg,rgba(255,255,255,0.22),rgba(255,255,255,0.08) 38%,rgba(255,255,255,0.045)),
    radial-gradient(circle at 18% 0%,rgba(255,255,255,0.24),transparent 34%),
    rgba(15,20,28,0.58);
  box-shadow:
    0 44px 130px rgba(0,0,0,0.58),
    0 0 0 1px rgba(255,255,255,0.05),
    inset 0 1px 0 rgba(255,255,255,0.42),
    inset 0 -1px 0 rgba(0,0,0,0.28);
  backdrop-filter:blur(36px) saturate(1.45);
  -webkit-backdrop-filter:blur(36px) saturate(1.45);
}
.login::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0.24),transparent 22%,transparent 72%,rgba(246,168,93,0.08));
  opacity:.72;
}
.login>*{position:relative;z-index:1}
.login-head{margin-bottom:25px}
.login-head img{width:205px;max-width:78%;filter:drop-shadow(0 16px 30px rgba(0,0,0,0.42));margin-bottom:28px}
.eyebrow{color:#f9c28c;font-family:var(--mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;margin:0 0 12px}
.login-head h1{margin:0 0 8px;font-size:38px;line-height:1;letter-spacing:0;font-weight:850}
.login-head small{display:block;color:rgba(255,255,255,0.66);font-size:15px;line-height:1.45}
.field{display:grid;gap:8px;margin-bottom:15px}
.field label{font-size:12px;color:rgba(255,255,255,0.7);font-weight:750}
.field input{
  width:100%;
  min-height:52px;
  border:1px solid rgba(255,255,255,0.16);
  border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(8,12,18,0.62));
  color:var(--text);
  padding:14px 14px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),inset 0 -10px 24px rgba(0,0,0,0.18);
}
.field input:hover{border-color:rgba(255,255,255,0.26)}
.field input:focus{border-color:rgba(247,213,22,0.66);box-shadow:0 0 0 4px rgba(247,213,22,0.12),inset 0 1px 0 rgba(255,255,255,0.16)}
.field input::placeholder{color:#777}
.login-remember{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,0.66);font-size:12px;margin:7px 0 18px;cursor:pointer}
.login-remember input{accent-color:var(--fire)}
.submit-btn{
  width:100%;
  min-height:52px;
  padding:14px 16px;
  text-transform:uppercase;
  font-size:12px;
  font-weight:850;
  letter-spacing:0.12em;
  background:
    linear-gradient(180deg,rgba(255,255,255,0.38),transparent 38%),
    linear-gradient(135deg,#ffc37d,#f59a50 48%,#dd722f);
  box-shadow:
    0 20px 54px rgba(246,168,93,0.26),
    inset 0 1px 0 rgba(255,255,255,0.55),
    inset 0 -1px 0 rgba(92,38,4,0.38);
}
.submit-btn:hover{transform:translateY(-1px);box-shadow:0 26px 64px rgba(246,168,93,0.32),inset 0 1px 0 rgba(255,255,255,0.6)}
.submit-btn:active{transform:translateY(0);filter:saturate(0.94) brightness(0.96)}
.submit-btn:focus-visible{outline:3px solid rgba(247,213,22,0.42);outline-offset:3px}
.login-err{display:none;color:#ffb4a9;font-size:12px;text-align:center;margin-top:12px}
@media(max-width:840px){
  .topbar{padding:16px 18px}
  body{overflow:auto}
  .portal{grid-template-columns:1fr;min-height:auto;padding:14px 0 38px}
  .brand-stage{min-height:330px;order:-1}
  .login{width:min(100%,430px);margin:0 auto}
}
@media(max-width:520px){
  .brand-copy span{display:none}
  .brand-mark-small{width:60px;height:32px}
  .top-actions{display:none}
  .brand-stage{min-height:280px}
  .login{padding:24px;border-radius:20px}
  .login-head h1{font-size:34px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;scroll-behavior:auto!important}
}

<body class="hf-shell">
<main class="page">
  <header class="topbar">
    <a class="brand-lockup" href="/" aria-label="Halo Fire secure client access">
      <img class="brand-mark-small" src="/public/brand/halo-fire-logo-glass.png" alt="Halo Fire" draggable="false">
      <span class="brand-copy"><strong>Halo Fire</strong><span>Secure client access</span></span>
    </a>
    <div class="top-actions">Secure access</div>
  </header>

  <section class="portal" aria-labelledby="loginTitle">
    <div class="brand-stage" id="haloHeroScene" aria-label="Halo Fire rendered brand scene">
      <canvas class="halo-three-canvas" id="haloHeroCanvas" data-renderer-mode="pending"></canvas>
      <img class="hero-logo-fallback" src="/public/brand/halo-fire-logo-glass.png" alt="Halo Fire" draggable="false">
      <div class="renderer-badge" id="rendererBadge" aria-hidden="true"></div>
    </div>

    <section class="login" aria-labelledby="loginTitle">
      <div class="login-head">
        <img src="/public/brand/halo-fire-logo-glass.png" alt="Halo Fire" draggable="false">
        <p class="eyebrow">Secure client access</p>
        <h1 id="loginTitle">Secure Portal</h1>
        <small>Sign in to continue.</small>
      </div>
      <form id="form">
        <div class="field"><label for="user">Email or username</label><input type="text" id="user" placeholder="name@company.com" autocomplete="username"></div>
        <div class="field"><label for="pass">Password</label><input type="password" id="pass" placeholder="Password" autocomplete="current-password"></div>
        <label class="login-remember"><input type="checkbox" id="remember" checked> Keep me signed in</label>
        <button type="submit" class="submit-btn">Sign in</button>
        <div class="login-err" id="err">Unable to sign in.</div>
      </form>
    </section>
  </section>
</main>

<script type="module">
import {
  AdditiveBlending,
  CanvasTexture,
  Group,
  Mesh,
  MeshBasicMaterial,
  PerspectiveCamera,
  Scene,
  Shape,
  ExtrudeGeometry,
  Sprite,
  SpriteMaterial,
  SRGBColorSpace,
  TorusGeometry,
  Vector3,
  WebGLRenderer,
} from 'three';
import { WebGPURenderer } from 'three/webgpu';

function buildGlowTexture(){
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, 'rgba(255, 214, 64, 0.9)');
  gradient.addColorStop(0.34, 'rgba(227, 38, 33, 0.5)');
  gradient.addColorStop(1, 'rgba(227, 38, 33, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const texture = new CanvasTexture(canvas);
  texture.colorSpace = SRGBColorSpace;
  return texture;
}

function seededUnit(index, offset){
  const raw = Math.sin(index * 12.9898 + offset * 78.233) * 43758.5453;
  return raw - Math.floor(raw);
}

function createLogoFlameShape(scale = 1){
  const shape = new Shape();
  shape.moveTo(-0.1 * scale, 1.18 * scale);
  shape.bezierCurveTo(0.24 * scale, 0.94 * scale, 0.48 * scale, 0.58 * scale, 0.55 * scale, 0.16 * scale);
  shape.bezierCurveTo(0.68 * scale, 0.36 * scale, 0.73 * scale, 0.63 * scale, 0.8 * scale, 0.86 * scale);
  shape.bezierCurveTo(1.12 * scale, 0.54 * scale, 1.18 * scale, -0.12 * scale, 0.82 * scale, -0.66 * scale);
  shape.bezierCurveTo(0.61 * scale, -0.97 * scale, 0.33 * scale, -1.18 * scale, 0.08 * scale, -1.34 * scale);
  shape.bezierCurveTo(-0.22 * scale, -1.1 * scale, -0.5 * scale, -0.82 * scale, -0.6 * scale, -0.4 * scale);
  shape.bezierCurveTo(-0.76 * scale, 0.28 * scale, -0.44 * scale, 0.65 * scale, -0.22 * scale, 0.84 * scale);
  shape.bezierCurveTo(-0.12 * scale, 0.96 * scale, -0.14 * scale, 1.08 * scale, -0.1 * scale, 1.18 * scale);
  return shape;
}

function createLogoFlameCutoutShape(scale = 1){
  const shape = new Shape();
  shape.moveTo(0.04 * scale, -0.98 * scale);
  shape.bezierCurveTo(0.18 * scale, -0.75 * scale, 0.32 * scale, -0.45 * scale, 0.2 * scale, -0.22 * scale);
  shape.bezierCurveTo(0.11 * scale, -0.06 * scale, -0.1 * scale, -0.06 * scale, -0.2 * scale, -0.22 * scale);
  shape.bezierCurveTo(-0.34 * scale, -0.46 * scale, -0.17 * scale, -0.78 * scale, 0.04 * scale, -0.98 * scale);
  return shape;
}

function createFlameMaterial(color, opacity = 1){
  return new MeshBasicMaterial({
    color,
    transparent:opacity < 1,
    opacity,
  });
}

function prepareDeformableMesh(mesh){
  const position = mesh.geometry.attributes.position;
  mesh.userData.basePositions = new Float32Array(position.array);
}

function smoothstep(edge0, edge1, x){
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function deformMeshVertices(mesh, time, hover, pulse, tug, tugStrength){
  const position = mesh.geometry.attributes.position;
  const base = mesh.userData.basePositions;
  if(!base) return;
  for(let i = 0; i < position.array.length; i += 3){
    const x = base[i];
    const y = base[i + 1];
    const z = base[i + 2];
    const lift = smoothstep(-1.3, 1.46, y);
    const dx = tug.x - x;
    const dy = tug.y - y;
    const distance = Math.hypot(dx, dy) || 1;
    const falloff = Math.exp(-distance * 1.85);
    const flex = (0.25 + lift * 0.9) * falloff * tugStrength * 0.34;
    position.array[i] = x + (dx / distance) * flex + Math.sin(time * 1.15 + y * 4.2) * 0.012 * lift * (1 + hover * 0.35);
    position.array[i + 1] = y + (dy / distance) * flex;
    position.array[i + 2] = z + Math.sin(time * 1.7 + y * 3.1 + x * 2) * 0.02 * lift + pulse * 0.02 * lift;
  }
  position.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}

async function getWebGpuAdapter(){
  if(!navigator.gpu) return null;
  return Promise.race([
    navigator.gpu.requestAdapter(),
    new Promise((resolve) => setTimeout(() => resolve(null), 700)),
  ]);
}

async function initHaloHeroScene(){
  const host = document.getElementById('haloHeroScene');
  const canvas = document.getElementById('haloHeroCanvas');
  const badge = document.getElementById('rendererBadge');
  if(!host || !canvas || !badge) return;

  const adapter = await getWebGpuAdapter();
  let renderer;
  let rendererMode = 'webgl';
  if(adapter){
    try{
      renderer = new WebGPURenderer({ canvas, antialias:true, alpha:true });
      await renderer.init();
      rendererMode = 'webgpu';
    }catch(error){
      renderer = new WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
      rendererMode = 'webgpu-failed-webgl';
      canvas.dataset.rendererError = error instanceof Error ? error.message : 'webgpu renderer init failed';
    }
  }else{
    renderer = new WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
  }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  canvas.dataset.rendererMode = rendererMode;
  canvas.dataset.interaction = 'idle';
  badge.textContent = '';

  const scene = new Scene();
  const camera = new PerspectiveCamera(33, 1, 0.1, 100);
  camera.position.set(0, 0.12, 5.8);

  const flameRoot = new Group();
  flameRoot.position.set(0, 0.02, 0);
  scene.add(flameRoot);

  const glowTexture = buildGlowTexture();
  const outlineMaterial = createFlameMaterial(0x050303, 0.96);
  const outerMaterial = createFlameMaterial(0xe32621, 0.94);
  const cutoutMaterial = new MeshBasicMaterial({ color:0x050505, transparent:false });
  const outlineFlame = new Mesh(new ExtrudeGeometry(createLogoFlameShape(0.62), {
    depth:0.12,
    bevelEnabled:true,
    bevelThickness:0.026,
    bevelSize:0.032,
    bevelSegments:5,
    curveSegments:32,
  }), outlineMaterial);
  outlineFlame.position.set(0.02, -0.13, -0.13);
  prepareDeformableMesh(outlineFlame);
  flameRoot.add(outlineFlame);

  const outerFlame = new Mesh(new ExtrudeGeometry(createLogoFlameShape(0.54), {
    depth:0.18,
    bevelEnabled:true,
    bevelThickness:0.034,
    bevelSize:0.032,
    bevelSegments:6,
    curveSegments:34,
  }), outerMaterial);
  outerFlame.position.set(0, -0.12, -0.02);
  prepareDeformableMesh(outerFlame);
  flameRoot.add(outerFlame);

  const cutoutFlame = new Mesh(new ExtrudeGeometry(createLogoFlameCutoutShape(0.62), {
    depth:0.05,
    bevelEnabled:true,
    bevelThickness:0.012,
    bevelSize:0.012,
    bevelSegments:4,
    curveSegments:28,
  }), cutoutMaterial);
  cutoutFlame.position.set(0.05, -0.03, 0.22);
  flameRoot.add(cutoutFlame);

  const halo = new Mesh(
    new TorusGeometry(0.56, 0.026, 24, 160),
    new MeshBasicMaterial({ color:0xf7d516, transparent:true, opacity:0.92, blending:AdditiveBlending }),
  );
  halo.position.set(-0.02, 0.68, 0.12);
  halo.rotation.set(1.18, 0.08, -0.08);
  flameRoot.add(halo);

  const sparks = [];
  for(let i = 0; i < 42; i += 1){
    const sx = seededUnit(i, 1) - 0.5;
    const sy = seededUnit(i, 2);
    const sz = seededUnit(i, 3);
    const so = seededUnit(i, 4);
    const ss = seededUnit(i, 5);
    const sprite = new Sprite(new SpriteMaterial({
      map:glowTexture,
      color:i % 3 === 0 ? 0xffd51f : 0xe32621,
      transparent:true,
      opacity:0.18 + so * 0.24,
      blending:AdditiveBlending,
      depthWrite:false,
    }));
    sprite.position.set(sx * 5.2, -1.62 + sy * 3.1, -0.74 - sz * 0.45);
    const scale = 0.045 + ss * 0.085;
    sprite.scale.set(scale, scale, scale);
    sprite.userData.velocity = 0.0018 + seededUnit(i, 6) * 0.004;
    sprite.userData.seed = i;
    sparks.push(sprite);
    flameRoot.add(sprite);
  }

  const pointer = new Vector3();
  const tugTarget = new Vector3(0, 0, 0);
  const tugCurrent = new Vector3(0, 0, 0);
  const tugRest = new Vector3(0, 0, 0);
  const dragState = { active:false, x:0, y:0, strength:0 };
  let hover = 0;
  let clickPulse = 0;
  host.style.cursor = 'grab';
  host.addEventListener('pointermove', (event) => {
    const rect = host.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
    pointer.y = ((event.clientY - rect.top) / rect.height - 0.5) * -2;
    if(dragState.active){
      tugTarget.set(pointer.x * 0.85, pointer.y * 1.22, 0);
      const dx = event.clientX - dragState.x;
      const dy = event.clientY - dragState.y;
      dragState.strength = Math.min(1, Math.hypot(dx, dy) / 180);
    }
  });
  host.addEventListener('pointerenter', () => {
    hover = 1;
    canvas.dataset.interaction = 'hover';
  });
  host.addEventListener('pointerleave', () => {
    hover = 0;
    dragState.active = false;
    dragState.strength = 0;
    canvas.dataset.interaction = 'idle';
    host.style.cursor = 'grab';
  });
  host.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    dragState.active = true;
    dragState.x = event.clientX;
    dragState.y = event.clientY;
    tugTarget.set(pointer.x * 0.85, pointer.y * 1.22, 0);
    clickPulse = 1;
    canvas.dataset.interaction = 'dragging';
    host.style.cursor = 'grabbing';
    host.setPointerCapture?.(event.pointerId);
  });
  host.addEventListener('pointerup', (event) => {
    dragState.active = false;
    dragState.strength = 0;
    canvas.dataset.interaction = 'released';
    host.style.cursor = 'grab';
    host.releasePointerCapture?.(event.pointerId);
  });

  function resize(){
    const rect = host.getBoundingClientRect();
    const width = Math.max(1, Math.floor(rect.width));
    const height = Math.max(1, Math.floor(rect.height));
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize, { passive:true });

  let frame = 0;
  function animate(){
    frame += 0.01;
    clickPulse *= 0.92;
    tugCurrent.lerp(dragState.active ? tugTarget : tugRest, 0.14);
    const tugStrength = dragState.active ? dragState.strength : 0;
    const breath = 1 + Math.sin(frame * 2.2) * 0.018 + clickPulse * 0.06;
    deformMeshVertices(outlineFlame, frame * 6.2, hover, clickPulse, tugCurrent, tugStrength);
    deformMeshVertices(outerFlame, frame * 6.2, hover, clickPulse, tugCurrent, tugStrength);
    outlineFlame.scale.set(1 + hover * 0.008, 1 + Math.sin(frame * 2.2) * 0.008, 1);
    outerFlame.scale.set(1 + hover * 0.012 + clickPulse * 0.012, breath, 1);
    cutoutFlame.scale.set(1 + hover * 0.008, 1 + Math.sin(frame * 2.2) * 0.006, 1);
    halo.position.y = 0.68 + Math.sin(frame * 1.7) * 0.018 + clickPulse * 0.022;
    halo.rotation.z = -0.08 + Math.sin(frame * 1.5) * 0.025 + clickPulse * 0.08;
    halo.scale.setScalar(1 + hover * 0.012 + clickPulse * 0.08);
    for(const spark of sparks){
      spark.position.y += spark.userData.velocity;
      spark.material.opacity *= 0.998;
      if(spark.position.y > 1.72 || spark.material.opacity < 0.08){
        spark.position.y = -1.62;
        spark.position.x = (seededUnit(spark.userData.seed, Math.floor(frame) + 7) - 0.5) * 5.2;
        spark.material.opacity = 0.18 + seededUnit(spark.userData.seed, Math.floor(frame) + 8) * 0.24;
      }
    }
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  host.classList.add('scene-ready');
  animate();
}

window.initHaloHeroScene = initHaloHeroScene;
initHaloHeroScene().catch((error) => {
  const canvas = document.getElementById('haloHeroCanvas');
  if(canvas){
    canvas.dataset.rendererMode = 'fallback-image';
    canvas.dataset.rendererError = error instanceof Error ? error.message : 'hero scene init failed';
  }
});
</script>

<script>
const HALOFIRE_BASE_PATH = window.location.pathname.startsWith('/halo-fire/') ? '/halo-fire' : '';

function safeWorkbenchRedirect(){
  const fallback = HALOFIRE_BASE_PATH + '/workbench.html';
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('redirect');
  if(!requested)return fallback;
  try{
    const target = new URL(requested, window.location.origin);
    const allowedPath = HALOFIRE_BASE_PATH + '/workbench.html';
    if(target.origin === window.location.origin && target.pathname === allowedPath){
      return target.pathname + target.search + target.hash;
    }
  }catch(_){}
  return fallback;
}

function storeLoginToken(data){
  const rememberEl = document.getElementById('remember');
  const remember = rememberEl ? rememberEl.checked : true;
  const store = remember ? localStorage : sessionStorage;
  try{
    store.setItem('halofire_token',data.token);
    store.setItem('halofire_user',JSON.stringify(data.user));
    (remember ? sessionStorage : localStorage).removeItem('halofire_token');
  }catch(_){
    // The server also sets an HttpOnly session cookie; storage is convenience.
  }
}

document.getElementById('form').onsubmit=async e=>{
  e.preventDefault();
  const er=document.getElementById('err');
  er.style.display='none';
  try{
    const res=await fetch(HALOFIRE_BASE_PATH + '/' + 'api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({
        username:document.getElementById('user').value,
        password:document.getElementById('pass').value,
      }),
    });
    if(!res.ok)throw new Error('bad credentials');
    const data=await res.json();
    storeLoginToken(data);
    window.location.href=safeWorkbenchRedirect();
  }catch(_){
    er.style.display='block';
  }
};
</script>
