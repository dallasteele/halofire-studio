<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft, login-style glow only. No halo ring, no flame shapes. The floating
         embers are drawn by the canvas in halofire-shell.js (static by default,
         optional slow drift). This image just adds gentle warm depth. -->
    <radialGradient id="glowLow" cx="50%" cy="96%" r="70%">
      <stop offset="0%" stop-color="#ffb866" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#e7702c" stop-opacity="0.16"/>
      <stop offset="72%" stop-color="#b8331a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1a0a06" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSoft" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#ffe6a8" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#ffb24d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1a0a06" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="800" cy="1000" rx="1150" ry="520" fill="url(#glowLow)"/>
  <ellipse cx="800" cy="560" rx="820" ry="640" fill="url(#glowSoft)"/>
</svg>
