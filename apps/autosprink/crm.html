<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaloFire — CRM Board (Internal Alpha)</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b0d10;--surface:rgba(22,26,32,0.72);--surface2:rgba(12,15,19,0.82);--fire:#E53935;--fire-light:#FF6E40;
    --ember:#d9a441;--gold:#d9a441;--gold-bright:#f0bd5a;--cyan:#5aa9e6;--green:#54b67a;--text:#e8ecf2;--muted:#9aa4b2;--bright:#fafafa;
    --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.14);--font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  }
  body{color:var(--text);font-family:var(--font);min-height:100vh;background:radial-gradient(900px 600px at 86% -8%,rgba(217,164,65,.10),transparent 60%),radial-gradient(700px 500px at -6% 110%,rgba(90,169,230,.06),transparent 60%),linear-gradient(160deg,#0e1318,#0a0c0f);background-attachment:fixed}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,0.045),rgba(255,255,255,0) 70%),rgba(14,17,21,0.78);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);position:sticky;top:0;z-index:10}
  .brand{font-weight:900;font-style:italic;font-size:20px;color:var(--bright)}
  .brand span{color:var(--fire)}
  .who{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .who a{color:var(--cyan);text-decoration:none;margin-left:12px;cursor:pointer}
  .alpha-banner{background:linear-gradient(90deg,rgba(229,57,53,.18),rgba(255,213,79,.12));border:1px solid rgba(229,57,53,.4);
    color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.5px;padding:8px 24px;text-align:center}
  main{max-width:1400px;margin:0 auto;padding:24px}
  .forms{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0) 42%),var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 24px rgba(0,0,0,.35)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;font-weight:700}
  label{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px}
  input,select,textarea{width:100%;background:rgba(0,0,0,0.32);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:9px 10px;font-size:13px;font-family:var(--font);outline:none}
  input:focus,select:focus,textarea:focus{border-color:rgba(217,164,65,.6);box-shadow:0 0 0 3px rgba(217,164,65,.14)}
  button.go{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a1206;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px;margin-top:12px;box-shadow:0 6px 18px rgba(217,164,65,.22)}
  button.go:hover{filter:brightness(1.08)}
  button.go:disabled{opacity:.5;cursor:wait}
  .board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
  .col{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0) 40%),var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;min-height:160px;display:flex;flex-direction:column;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.3)}
  .col.dragover{border-color:var(--ember);background:rgba(240,168,104,.06)}
  .col h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ember);margin-bottom:10px;font-weight:700;display:flex;justify-content:space-between}
  .col h3 .cnt{color:var(--muted);font-family:var(--mono)}
  .bidcard{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:9px;cursor:grab}
  .bidcard:active{cursor:grabbing}
  .bidcard .t{font-size:13px;color:var(--bright);font-weight:600;margin-bottom:4px}
  .bidcard .meta{font-size:11px;color:var(--muted);font-family:var(--mono);line-height:1.6}
  .bidcard .tis{color:var(--cyan)}
  .bidcard .due{color:var(--gold)}
  .adv{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .adv button{background:rgba(240,168,104,.12);border:1px solid rgba(240,168,104,.4);color:var(--ember);border-radius:99px;padding:3px 9px;font-size:10px;font-family:var(--mono);cursor:pointer}
  .adv button:hover{background:rgba(240,168,104,.22)}
  .muted{color:var(--muted);font-size:12px}
  .empty{color:var(--muted);font-size:11px;font-style:italic;font-family:var(--mono)}
  .err{color:var(--fire-light);font-size:12px;font-family:var(--mono);margin-top:8px}
  .intake{background:linear-gradient(180deg,rgba(255,255,255,0.035),rgba(255,255,255,0) 42%),var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 24px rgba(0,0,0,.35)}
  .intake h2{margin-bottom:8px}
  .intake .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px}
  .intake .meta b{color:var(--cyan)}
  .recent{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
  .rrow{display:flex;align-items:center;gap:10px;font-size:12px;border-bottom:1px solid var(--border);padding:5px 0}
  .rrow .sc{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px}
  .rrow .sc.bid{background:rgba(74,222,128,.15);color:var(--green)}
  .rrow .sc.nobid{background:rgba(113,113,122,.18);color:var(--muted)}
  .rrow .why{color:var(--muted);font-family:var(--mono);font-size:10px}
  .rrow .ti{color:var(--bright);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bidcard .ev{margin-top:6px;font-size:10px;font-family:var(--mono)}
  .bidcard .ev a{color:var(--cyan);text-decoration:none;cursor:pointer}
  .bidcard .ev a:hover{text-decoration:underline}
  /* AB3-5 per-card actions */
  .acts{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .acts button{background:rgba(77,208,225,.10);border:1px solid rgba(77,208,225,.35);color:var(--cyan);border-radius:99px;padding:3px 9px;font-size:10px;font-family:var(--mono);cursor:pointer}
  .acts button:hover{background:rgba(77,208,225,.20)}
  /* The human approval gate — visually distinct (ember), never auto. */
  .acts button.approve{background:rgba(240,168,104,.16);border-color:rgba(240,168,104,.6);color:var(--ember);font-weight:700}
  .acts button.approve:hover{background:rgba(240,168,104,.28)}
  .bidcard .est{margin-top:6px;font-size:10px;font-family:var(--mono);color:var(--green)}
  .bidcard .fu{display:inline-block;margin-top:6px;background:rgba(255,213,79,.16);border:1px solid rgba(255,213,79,.5);color:var(--gold);border-radius:99px;padding:2px 8px;font-size:10px;font-family:var(--mono)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .modal .box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:520px;width:92%}
  .modal .box h3{color:var(--ember);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  .modal .box .gate{background:rgba(240,168,104,.08);border:1px solid rgba(240,168,104,.35);border-radius:8px;padding:9px;font-size:11px;color:var(--ember);margin:8px 0}
  .modal .box .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .modal .box button.cancel{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 14px;cursor:pointer}
</style>
<!-- Shared cookie-session auth guard (HFAuth). Classic script: window.HFAuth
     exists before the module script below runs. -->
<script src="/public/halofire-auth.js"></script>
</head>
<body>
<header>
  <div class="brand">Halo<span>Fire</span> · CRM</div>
  <div class="who"><a href="/calendar.html">← Calendar</a><a href="/workbench.html">Workbench</a><a href="/autosprink.html">Sprinkler Studio →</a><span id="whoami" data-whoami>…</span><a id="logout">Sign out</a></div>
</header>
<div class="alpha-banner">INTERNAL ALPHA · AUTO-BID CRM · outbound email requires explicit human approval per message · nothing fabricated</div>
<main>
  <div class="forms">
    <div class="card">
      <h2>New Client</h2>
      <label>Name *</label><input id="cName" placeholder="Contact name">
      <label>Company</label><input id="cCompany" placeholder="General contractor / firm">
      <label>Email</label><input id="cEmail" type="email" placeholder="bids@example.com">
      <label>Phone</label><input id="cPhone" placeholder="(555) 555-5555">
      <button class="go" id="cBtn">Create client</button>
      <div class="err" id="cErr"></div>
    </div>
    <div class="card">
      <h2>New Bid Request</h2>
      <label>Title *</label><input id="bTitle" placeholder="e.g. Warehouse sprinkler ITB">
      <label>Client</label><select id="bClient"><option value="">— none —</option></select>
      <label>Source</label>
      <select id="bSource"><option value="manual">manual</option><option value="email">email</option></select>
      <label>Due date</label><input id="bDue" type="date">
      <button class="go" id="bBtn">Create bid request</button>
      <div class="err" id="bErr"></div>
    </div>
  </div>
  <div class="intake" id="intake">
    <h2>Email Intake</h2>
    <div class="meta" id="intakeMeta">loading intake status…</div>
    <div class="recent" id="intakeRecent"></div>
  </div>
  <div class="board" id="board"><span class="muted">Loading board…</span></div>
</main>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script type="module">
const BASE_PATH = window.location.pathname.startsWith('/halo-fire/') ? '/halo-fire' : '';
const API_BASE = BASE_PATH + '/api';
const STATUSES = ['received', 'reviewing', 'estimating', 'bid_sent', 'won', 'lost'];
const ALLOWED = {
  received: ['reviewing'],
  reviewing: ['estimating', 'lost'],
  estimating: ['bid_sent', 'lost'],
  bid_sent: ['won', 'lost'],
  won: [],
  lost: ['reviewing'],
};
const LABEL = { received: 'Received', reviewing: 'Reviewing', estimating: 'Estimating', bid_sent: 'Bid sent', won: 'Won', lost: 'Lost' };

// Cookie-session auth via shared HFAuth guard (/public/halofire-auth.js).
// HFAuth.guard() (called at load, below) is the ONLY place that may redirect
// to login, and only on a real 401 from /api/auth/me. Feature API calls that
// 401 just throw — the old blanket 401->redirect here caused false logouts.
function api(path, options = {}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  return HFAuth.api(path, { ...options, headers });
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

document.getElementById('logout').onclick = () => { HFAuth.logout(); };

let clients = [];
let bids = [];
let followupIds = new Set();

function clientName(id){
  const c = clients.find((x) => x.id === id);
  return c ? (c.company || c.name) : null;
}

function fmtTimeInStatus(history){
  if (!Array.isArray(history) || history.length === 0) return '—';
  const last = history[history.length - 1];
  const ms = Date.now() - Date.parse(last.atIso);
  if (!Number.isFinite(ms) || ms < 0) return '—';
  const mins = Math.floor(ms / 60000);
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  return Math.floor(hrs / 24) + 'd';
}

async function transition(id, to){
  try{
    await api('/bid-requests/' + id + '/transition', { method:'POST', body: JSON.stringify({ to }) });
    await loadBoard();
  }catch(e){ alert('Transition rejected: ' + e.message); }
}

// ── AB3-5 card actions ──
const modal = document.getElementById('modal');
const modalBox = document.getElementById('modalBox');
function openModal(html){ modalBox.innerHTML = html; modal.classList.add('open'); }
function closeModal(){ modal.classList.remove('open'); modalBox.innerHTML = ''; }
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

const ESTIMATE_TEMPLATE = JSON.stringify({
  overheadPct: 10, profitPct: 10,
  items: [{ description: 'Pendent sprinkler head', quantity: 40, unit: 'ea', unitCost: 12.5 }],
}, null, 2);

function estimateDialog(id){
  openModal(`<h3>Estimate bid #${id}</h3>
    <div class="gate">Manual line items OR a CAD bid-payload (source:"halofire-cad"). Every estimate is a design aid, not a committed bid.</div>
    <label style="font-size:11px;color:var(--muted)">Estimate JSON</label>
    <textarea id="estJson" rows="12" style="font-family:var(--mono);font-size:11px">${escapeHtml(ESTIMATE_TEMPLATE)}</textarea>
    <div class="err" id="estErr"></div>
    <div class="row"><button class="cancel" data-act="modal-cancel">Cancel</button>
      <button class="go" data-act="estimate-submit" data-id="${id}">Price it</button></div>`);
}

async function submitEstimate(id){
  const errEl = document.getElementById('estErr'); errEl.textContent = '';
  let body;
  try{ body = JSON.parse(document.getElementById('estJson').value); }
  catch(_){ errEl.textContent = 'Invalid JSON.'; return; }
  try{
    await api('/bid-requests/' + id + '/estimate', { method:'POST', body: JSON.stringify(body) });
    closeModal();
    await loadBoard();
  }catch(e){ errEl.textContent = e.message; }
}

async function renderBid(id){
  try{
    await api('/bid-requests/' + id + '/render-bid', { method:'POST' });
    await loadBoard();
    alert('Branded HTML bid rendered and stored. Use "View HTML" to preview, then "Create draft".');
  }catch(e){ alert('Render failed: ' + e.message); }
}

function viewBid(id){
  // The stored HTML is auth-gated; the session cookie rides along, then open in a new tab.
  fetch(API_BASE + '/bid-requests/' + id + '/render-bid', { credentials:'include' })
    .then((r) => r.ok ? r.text() : Promise.reject(new Error('no rendered bid')))
    .then((html) => { const w = window.open('', '_blank'); if (w) { w.document.write(html); w.document.close(); } })
    .catch((e) => alert('Cannot open bid: ' + e.message));
}

async function createDraft(id){
  try{
    const draft = await api('/bid-requests/' + id + '/outbound-draft', { method:'POST', body: JSON.stringify({}) });
    approveDialog(draft.id, id, draft.to_email, draft.subject, draft.any_estimated);
  }catch(e){ alert('Draft not created: ' + e.message); }
}

function approveDialog(draftId, bidId, toEmail, subject, anyEstimated){
  const estWarn = anyEstimated
    ? '<div class="gate" style="background:#fffbeb;border-color:#fcd34d;color:#92400e"><b>ESTIMATED PRICES.</b> This bid contains one or more representative or unpriced lines (marked <b>*</b> in the document), NOT firm sourced prices. Verify them before sending.</div>'
    : '';
  openModal(`<h3>Send bid #${bidId}</h3>
    <div class="gate"><b>HUMAN APPROVAL GATE.</b> Nothing has been sent. Approving will transmit this email via the configured SMTP account. There is no auto-send anywhere — this per-message approval is the only send path. If SMTP is not configured, approval is refused.</div>
    ${estWarn}
    <div style="font-size:12px;font-family:var(--mono);color:var(--muted)">
      <div>to: <span style="color:var(--cyan)">${escapeHtml(toEmail)}</span></div>
      <div>subject: ${escapeHtml(subject)}</div>
    </div>
    <div class="err" id="apvErr"></div>
    <div class="row"><button class="cancel" data-act="modal-cancel">Keep as draft</button>
      <button class="go approve-go" data-act="approve-submit" data-draft="${draftId}">Approve &amp; send</button></div>`);
}

async function submitApprove(draftId){
  const errEl = document.getElementById('apvErr'); errEl.textContent = '';
  try{
    await api('/outbound-drafts/' + draftId + '/approve', { method:'POST' });
    closeModal();
    await loadBoard();
    alert('Approved and sent. Bid advanced to "Bid sent".');
  }catch(e){ errEl.textContent = e.message; }
}

function outcomeDialog(id, outcome){
  openModal(`<h3>Mark bid #${id} ${outcome}</h3>
    <label style="font-size:11px;color:var(--muted)">Outcome notes</label>
    <textarea id="outNotes" rows="3" placeholder="Why won/lost (optional)"></textarea>
    <div class="err" id="outErr"></div>
    <div class="row"><button class="cancel" data-act="modal-cancel">Cancel</button>
      <button class="go" data-act="outcome-submit" data-id="${id}" data-outcome="${outcome}">Record ${outcome}</button></div>`);
}

async function submitOutcome(id, outcome){
  const errEl = document.getElementById('outErr'); errEl.textContent = '';
  try{
    await api('/bid-requests/' + id + '/outcome', { method:'POST', body: JSON.stringify({ outcome, notes: document.getElementById('outNotes').value || null }) });
    closeModal();
    await loadBoard();
  }catch(e){ errEl.textContent = e.message; }
}

// Modal-scoped button delegation (buttons are recreated each open).
modalBox.addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'modal-cancel') return closeModal();
  if (act === 'estimate-submit') return submitEstimate(Number(btn.dataset.id));
  if (act === 'approve-submit') return submitApprove(Number(btn.dataset.draft));
  if (act === 'outcome-submit') return submitOutcome(Number(btn.dataset.id), btn.dataset.outcome);
});

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = STATUSES.map((status) => {
    const colBids = bids.filter((b) => b.status === status);
    const cards = colBids.length ? colBids.map((b) => {
      const cname = clientName(b.client_id);
      const adv = (ALLOWED[status] || []).map((to) =>
        `<button data-act="adv" data-id="${b.id}" data-to="${to}">→ ${escapeHtml(LABEL[to])}</button>`).join('');
      const fromEmail = b.source === 'email';
      const hasEstimate = b.estimate_total_cents != null;
      const hasHtml = Boolean(b.bid_html_set);
      const dollars = hasEstimate ? '$' + (b.estimate_total_cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : null;
      const isFollowup = followupIds.has(b.id);
      // Per-status actions: estimate (reviewing/estimating), render+draft once an
      // estimate exists, the approval gate on a draft, and won/lost on bid_sent.
      const acts = [];
      if (status === 'reviewing' || status === 'estimating') acts.push(`<button data-act="estimate" data-id="${b.id}">＄ Estimate</button>`);
      if (hasEstimate) acts.push(`<button data-act="render" data-id="${b.id}">⧉ Render bid</button>`);
      if (hasHtml) acts.push(`<button data-act="view-bid" data-id="${b.id}">↗ View HTML</button>`);
      if (status === 'estimating' && hasHtml) acts.push(`<button data-act="draft" data-id="${b.id}">✉ Create draft</button>`);
      if (status === 'bid_sent') { acts.push(`<button data-act="outcome" data-id="${b.id}" data-outcome="won">✓ Won</button>`); acts.push(`<button data-act="outcome" data-id="${b.id}" data-outcome="lost">✕ Lost</button>`); }
      return `<div class="bidcard" draggable="true" data-id="${b.id}" data-status="${status}">
        <div class="t">${escapeHtml(b.title)}</div>
        <div class="meta">
          ${cname ? '👤 ' + escapeHtml(cname) + '<br>' : ''}
          ${fromEmail ? '<span style="color:var(--cyan)">✉ from email</span><br>' : ''}
          ${b.due_date ? '<span class="due">due ' + escapeHtml(b.due_date) + '</span><br>' : ''}
          <span class="tis">in status ${escapeHtml(fmtTimeInStatus(b.status_history))}</span>
        </div>
        ${dollars ? `<div class="est">est ${escapeHtml(dollars)} · design-aid, not committed${b.estimate_any_estimated ? ' · <span style="color:var(--ember,#b45309);font-weight:700">⚠ contains estimated prices</span>' : ''}</div>` : ''}
        ${isFollowup ? '<span class="fu">⏰ follow-up due</span>' : ''}
        ${fromEmail ? `<div class="ev"><a data-act="ev" data-id="${b.id}">view plan attachments →</a></div>` : ''}
        ${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}
        <div class="adv">${adv || '<span class="empty">terminal</span>'}</div>
      </div>`;
    }).join('') : '<span class="empty">empty</span>';
    return `<div class="col" data-status="${status}">
      <h3>${escapeHtml(LABEL[status])} <span class="cnt">${colBids.length}</span></h3>
      <div class="coldrop">${cards}</div>
    </div>`;
  }).join('');

  board.querySelectorAll('button[data-act="adv"]').forEach((btn) => {
    btn.onclick = () => transition(Number(btn.dataset.id), btn.dataset.to);
  });
  board.querySelectorAll('a[data-act="ev"]').forEach((a) => {
    a.onclick = () => showEvidence(Number(a.dataset.id));
  });
  board.querySelectorAll('button[data-act="estimate"]').forEach((b) => { b.onclick = () => estimateDialog(Number(b.dataset.id)); });
  board.querySelectorAll('button[data-act="render"]').forEach((b) => { b.onclick = () => renderBid(Number(b.dataset.id)); });
  board.querySelectorAll('button[data-act="view-bid"]').forEach((b) => { b.onclick = () => viewBid(Number(b.dataset.id)); });
  board.querySelectorAll('button[data-act="draft"]').forEach((b) => { b.onclick = () => createDraft(Number(b.dataset.id)); });
  board.querySelectorAll('button[data-act="outcome"]').forEach((b) => { b.onclick = () => outcomeDialog(Number(b.dataset.id), b.dataset.outcome); });
  wireDragDrop();
}

async function showEvidence(id){
  try{
    const r = await api('/bid-requests/' + id + '/evidence');
    if (!r.evidence || !r.evidence.length){ alert('No plan attachments recorded for this bid.'); return; }
    const lines = r.evidence.map((e) => `• ${e.source_file} [${e.status}] ${e.source_ref}`).join('\n');
    alert('Plan attachments for "' + r.project_name + '":\n\n' + lines);
  }catch(e){ alert('Evidence unavailable: ' + e.message); }
}

function scorePct(s){ return Number.isFinite(s) ? Math.round(s * 100) + '%' : '—'; }

async function loadIntakeStatus(){
  const meta = document.getElementById('intakeMeta');
  const recent = document.getElementById('intakeRecent');
  try{
    const s = await api('/autobid/intake/status');
    const cfg = s.configured ? 'configured' : 'not configured';
    const en = s.enabled ? 'polling on' : 'polling off';
    const last = s.last_poll_at ? new Date(s.last_poll_at).toLocaleString() : 'never';
    meta.innerHTML = `intake: <b>${cfg}</b> · <b>${en}</b> · last poll <b>${escapeHtml(last)}</b>`
      + ` · seen ${s.last_messages_seen ?? '—'} · bids ${s.last_bids_created ?? '—'}`
      + (s.last_error ? ` · <span style="color:var(--fire-light)">last error: ${escapeHtml(s.last_error)}</span>` : '');
    if (!s.recent || !s.recent.length){
      recent.innerHTML = '<span class="empty">no classified messages yet — the operator sees every classification here with its score and reasons.</span>';
      return;
    }
    recent.innerHTML = s.recent.map((r) => {
      const cls = r.is_likely_bid ? 'bid' : 'nobid';
      const why = (r.reasons && r.reasons.length) ? r.reasons.join(', ') : (r.is_likely_bid ? '—' : 'no bid signals');
      const title = r.bid_title || (r.is_likely_bid ? '(bid)' : '(not a bid)');
      return `<div class="rrow">
        <span class="sc ${cls}">${scorePct(r.score)} ${r.is_likely_bid ? 'BID' : 'skip'}</span>
        <span class="ti">${escapeHtml(title)}</span>
        <span class="why">${escapeHtml(why)}</span>
      </div>`;
    }).join('');
  }catch(e){ meta.innerHTML = '<span style="color:var(--fire-light)">intake status unavailable: ' + escapeHtml(e.message) + '</span>'; }
}

function wireDragDrop(){
  let draggingId = null; let draggingFrom = null;
  document.querySelectorAll('.bidcard').forEach((card) => {
    card.addEventListener('dragstart', () => { draggingId = Number(card.dataset.id); draggingFrom = card.dataset.status; });
  });
  document.querySelectorAll('.col').forEach((col) => {
    const to = col.dataset.status;
    col.addEventListener('dragover', (e) => {
      if (draggingFrom && (ALLOWED[draggingFrom] || []).includes(to)) { e.preventDefault(); col.classList.add('dragover'); }
    });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', (e) => {
      e.preventDefault(); col.classList.remove('dragover');
      if (draggingId != null && draggingFrom && (ALLOWED[draggingFrom] || []).includes(to)) {
        transition(draggingId, to);
      }
      draggingId = null; draggingFrom = null;
    });
  });
}

function refreshClientSelect(){
  const sel = document.getElementById('bClient');
  const current = sel.value;
  sel.innerHTML = '<option value="">— none —</option>' +
    clients.map((c) => `<option value="${c.id}">${escapeHtml(c.company || c.name)}</option>`).join('');
  sel.value = current;
}

async function loadClients(){ clients = await api('/clients'); refreshClientSelect(); }
async function loadFollowups(){
  try{ const r = await api('/bid-requests/followups'); followupIds = new Set((r.followups || []).map((f) => f.id)); }
  catch(_){ followupIds = new Set(); }
}
async function loadBoard(){ bids = await api('/bid-requests'); await loadFollowups(); renderBoard(); }

document.getElementById('cBtn').onclick = async () => {
  const errEl = document.getElementById('cErr'); errEl.textContent = '';
  const name = document.getElementById('cName').value.trim();
  if (!name){ errEl.textContent = 'Name is required.'; return; }
  try{
    await api('/clients', { method:'POST', body: JSON.stringify({
      name,
      company: document.getElementById('cCompany').value.trim() || null,
      email: document.getElementById('cEmail').value.trim() || null,
      phone: document.getElementById('cPhone').value.trim() || null,
    }) });
    ['cName','cCompany','cEmail','cPhone'].forEach((id) => { document.getElementById(id).value = ''; });
    await loadClients();
  }catch(e){ errEl.textContent = e.message; }
};

document.getElementById('bBtn').onclick = async () => {
  const errEl = document.getElementById('bErr'); errEl.textContent = '';
  const title = document.getElementById('bTitle').value.trim();
  if (!title){ errEl.textContent = 'Title is required.'; return; }
  const clientVal = document.getElementById('bClient').value;
  try{
    await api('/bid-requests', { method:'POST', body: JSON.stringify({
      title,
      client_id: clientVal ? Number(clientVal) : null,
      source: document.getElementById('bSource').value,
      due_date: document.getElementById('bDue').value || null,
    }) });
    document.getElementById('bTitle').value = '';
    document.getElementById('bDue').value = '';
    await loadBoard();
  }catch(e){ errEl.textContent = e.message; }
};

(async () => {
  // guard() fills [data-whoami] and redirects to login on a real 401.
  const me = await HFAuth.guard();
  if (!me) return;
  await loadClients();
  await loadBoard();
  await loadIntakeStatus();
})();
</script>
