<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Blossom Rock source-registration failure in three dimensions</title>
  <desc id="desc">The source-supported Lake Pump Room envelope and eight completed upright heads are compared with the sealed six-target candidate, which used a smaller footprint, a quarter-inch slope, the wrong roof datum, and no PDF transform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#10283b"/></linearGradient>
    <linearGradient id="actual" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee" stop-opacity=".58"/><stop offset="1" stop-color="#0ea5e9" stop-opacity=".22"/></linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ef4444" stop-opacity=".52"/><stop offset="1" stop-color="#7f1d1d" stop-opacity=".25"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".45"/></filter>
    <style>
      text{font-family:Inter,Segoe UI,sans-serif;fill:#e6edf5}.muted{fill:#9fb3c6}.label{font-size:20px;font-weight:700}.small{font-size:16px}.actualLine{stroke:#22d3ee;stroke-width:5;fill:none}.badLine{stroke:#ef4444;stroke-width:5;stroke-dasharray:14 10;fill:none}.headA{fill:#22c55e;stroke:#052e16;stroke-width:4}.headB{fill:#ef4444;stroke:#450a0a;stroke-width:4}.stemA{stroke:#86efac;stroke-width:4}.stemB{stroke:#fca5a5;stroke-width:4}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="36" y="32" width="1328" height="96" rx="24" fill="#3f1318" stroke="#ef4444" stroke-width="3"/>
  <text x="70" y="72" font-size="26" font-weight="800">FAILED HOLDOUT — THIS IS A DIAGNOSTIC, NOT A FIELD MODEL</text>
  <text x="70" y="105" class="small">Actual source envelope and approved answer expose a cross-sheet feature-registration error in the sealed candidate.</text>

  <g filter="url(#shadow)">
    <rect x="36" y="160" width="850" height="690" rx="28" fill="#0c1d2b" stroke="#29445f" stroke-width="2"/>
    <text x="72" y="205" class="label">Source-supported envelope + completed answer pattern</text>
    <text x="72" y="234" class="small muted">A3.1/A3.2 footprint · A5.1/M2.0 sloped roof · A6.1 open structure · A8.1 Roof 3 section</text>
    <polygon points="150,730 590,730 770,620 330,620" fill="#132c3e" stroke="#4f6b80" stroke-width="3"/>
    <polygon points="150,730 150,480 330,370 330,620" fill="#0b2634" stroke="#22d3ee" stroke-width="3"/>
    <polygon points="590,730 590,420 770,310 770,620" fill="#0b2634" stroke="#22d3ee" stroke-width="3"/>
    <polygon points="150,480 590,420 770,310 330,370" fill="url(#actual)" stroke="#22d3ee" stroke-width="5"/>
    <line x1="150" y1="480" x2="590" y2="420" class="actualLine"/>
    <text x="390" y="286" class="label" fill="#67e8f9">Lake Pump Room — larger Roof 3 plane</text>
    <text x="390" y="314" class="small">source roof slope shown as 1 1/2 in : 12 in</text>
    <text x="344" y="785" class="small">source/approved footprint visibly exceeds sealed 29 ft 5 in × 14 ft plane</text>
    <g>
      <line x1="245" y1="468" x2="245" y2="510" class="stemA"/><circle cx="245" cy="510" r="11" class="headA"/>
      <line x1="345" y1="454" x2="345" y2="496" class="stemA"/><circle cx="345" cy="496" r="11" class="headA"/>
      <line x1="445" y1="441" x2="445" y2="483" class="stemA"/><circle cx="445" cy="483" r="11" class="headA"/>
      <line x1="545" y1="427" x2="545" y2="469" class="stemA"/><circle cx="545" cy="469" r="11" class="headA"/>
      <line x1="360" y1="396" x2="360" y2="438" class="stemA"/><circle cx="360" cy="438" r="11" class="headA"/>
      <line x1="460" y1="382" x2="460" y2="424" class="stemA"/><circle cx="460" cy="424" r="11" class="headA"/>
      <line x1="560" y1="369" x2="560" y2="411" class="stemA"/><circle cx="560" cy="411" r="11" class="headA"/>
      <line x1="660" y1="355" x2="660" y2="397" class="stemA"/><circle cx="660" cy="397" r="11" class="headA"/>
    </g>
    <rect x="90" y="274" width="250" height="62" rx="16" fill="#064e3b" stroke="#22c55e"/><text x="112" y="301" class="label">8 approved uprights</text><text x="112" y="324" class="small">4 × 2 visible on FP2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="914" y="160" width="450" height="690" rx="28" fill="#24161b" stroke="#71343b" stroke-width="2"/>
    <text x="950" y="205" class="label">Sealed source candidate</text>
    <text x="950" y="234" class="small muted">Preserved unchanged for audit</text>
    <polygon points="970,575 1248,575 1310,535 1032,535" fill="url(#bad)" class="badLine"/>
    <line x1="970" y1="575" x2="1248" y2="570" class="badLine"/>
    <g>
      <line x1="1020" y1="566" x2="1020" y2="606" class="stemB"/><circle cx="1020" cy="606" r="10" class="headB"/>
      <line x1="1105" y1="564" x2="1105" y2="604" class="stemB"/><circle cx="1105" cy="604" r="10" class="headB"/>
      <line x1="1190" y1="562" x2="1190" y2="602" class="stemB"/><circle cx="1190" cy="602" r="10" class="headB"/>
      <line x1="1060" y1="548" x2="1060" y2="588" class="stemB"/><circle cx="1060" cy="588" r="10" class="headB"/>
      <line x1="1145" y1="546" x2="1145" y2="586" class="stemB"/><circle cx="1145" cy="586" r="10" class="headB"/>
      <line x1="1230" y1="544" x2="1230" y2="584" class="stemB"/><circle cx="1230" cy="584" r="10" class="headB"/>
    </g>
    <text x="950" y="290" class="small">6 orientation-unresolved targets</text>
    <text x="950" y="322" class="small">29 ft 5 in × 14 ft rectangle</text>
    <text x="950" y="354" class="small">0.25 : 12 slope</text>
    <text x="950" y="386" class="small">Roof 1 datum 13 ft 8 1/8 in</text>
    <text x="950" y="418" class="small" fill="#fca5a5">No sealed PDF-to-local transform</text>
    <rect x="946" y="680" width="386" height="118" rx="18" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="970" y="716" class="label">Production result: BLOCKED</text>
    <text x="970" y="748" class="small">SOURCE_EXPOSED_SLOPE_</text>
    <text x="970" y="774" class="small">REGISTRATION_BLOCKED</text>
  </g>
</svg>
