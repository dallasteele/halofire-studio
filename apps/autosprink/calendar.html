<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaloFire — Calendar</title>
<!-- Shared HaloFire apple-glass shell (themeable glass + app bar + brandmark). -->
<link rel="stylesheet" href="/public/styles/halofire-glass.css?v=11">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#08080a;--surface:#111114;--surface2:#18181c;--fire:#E53935;--gold:#d9a441;--cyan:#4DD0E1;--green:#4ade80;--text:#d4d4d8;--muted:#71717a;--bright:#fafafa;--border:rgba(255,255,255,.08);--font:'Inter Variable','Inter',system-ui,sans-serif;--mono:'JetBrains Mono Variable',ui-monospace,monospace}
  /* Bridge: legacy card-surface vars become the themeable glass so the Settings picker recolors this page too. */
  :root{--surface:var(--hf-glass);--surface2:var(--hf-glass-2);--bg:var(--hf-bg);--border:var(--hf-line,rgba(255,255,255,.08));--text:var(--hf-text,#d4d4d8);--muted:var(--hf-muted,#71717a);--bright:var(--hf-text,#fafafa)}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(1200px 500px at 50% -10%,rgba(229,57,53,.07),transparent 60%);pointer-events:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(8,8,10,.72);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);position:sticky;top:0;z-index:10}
  .brand{font-weight:900;font-style:italic;font-size:20px;color:var(--bright)} .brand span{color:var(--fire)}
  .nav{display:flex;align-items:center;gap:14px}
  .nav a{color:var(--cyan);text-decoration:none;font-size:13px;cursor:pointer}
  .nav a.current{color:var(--bright);font-weight:700}
  .whoami{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:3px 10px;background:var(--surface)}
  main{max-width:1180px;margin:0 auto;padding:22px;display:grid;grid-template-columns:2fr 1fr;gap:18px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--hf-glass,rgba(17,17,20,.82));border:1px solid var(--hf-line,var(--border));border-radius:14px;padding:18px;backdrop-filter:var(--hf-blur-panel,blur(14px));-webkit-backdrop-filter:var(--hf-blur-panel,blur(14px));box-shadow:var(--hf-shadow,0 8px 30px rgba(0,0,0,.35))}
  .card.wide{grid-column:1/-1}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:12px;font-weight:700}
  .banner{grid-column:1/-1;background:linear-gradient(90deg,rgba(217,164,65,.14),rgba(229,57,53,.08));border:1px solid rgba(217,164,65,.4);color:var(--gold);font-family:var(--mono);font-size:12px;padding:10px 14px;border-radius:10px}
  .banner b{letter-spacing:.6px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-title{font-size:18px;font-weight:800;color:var(--bright)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:1px}
  .day{min-height:72px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .day.out{opacity:.35}
  .day.today{border-color:rgba(229,57,53,.55);box-shadow:0 0 0 1px rgba(229,57,53,.3) inset;color:var(--bright)}
  .day .n{font-size:11px}
  .lane-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface2)}
  .lane-item .proj{font-size:13px;color:var(--bright);font-weight:700}
  .lane-item .meta{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
  .st{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(217,164,65,.15);color:var(--gold)}
  button{background:var(--fire);color:#fff;border:none;border-radius:7px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:12px}
  button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
  .muted{color:var(--muted);font-size:12px}
  .approve-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .approve-note{font-family:var(--mono);font-size:10px;color:var(--muted)}
  /* calendar view controls (Day/Week/Month) + nav */
  .cal-controls{display:flex;align-items:center;gap:8px}
  /* override the shared fire/gold button tokens so these read as subtle chrome */
  .cal-controls .nav-btn{background:var(--surface2)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:7px!important;padding:6px 11px!important;font-weight:600!important;font-size:12px!important;font-family:var(--font)!important;filter:none!important}
  .cal-controls .nav-btn:hover{background:rgba(255,255,255,.08)!important;border-color:rgba(217,164,65,.45)!important}
  .view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:4px}
  .cal-controls .seg-btn{background:transparent!important;color:var(--muted)!important;border:none!important;border-radius:0!important;padding:6px 15px!important;font-weight:600!important;font-size:12px!important;font-family:var(--font)!important;filter:none!important}
  .cal-controls .seg-btn:hover{color:var(--bright)!important;background:rgba(255,255,255,.05)!important}
  .cal-controls .seg-btn.on{background:rgba(217,164,65,.18)!important;color:var(--bright)!important;box-shadow:inset 0 -2px 0 var(--gold)}
  /* week view */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .week-col{background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;min-height:440px;display:flex;flex-direction:column}
  .week-col-head{padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);background:rgba(255,255,255,.03)}
  .week-col-head .dn{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .week-col-head .dd{font-size:16px;font-weight:800;color:var(--bright)}
  .week-col.today .week-col-head{background:rgba(229,57,53,.14)}
  .week-col.today .dd{color:var(--fire)}
  .week-body{flex:1;display:flex;flex-direction:column}
  .wk-hour{flex:1;border-top:1px dashed rgba(255,255,255,.05);font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.2);padding:2px 5px;min-height:28px}
  /* day view */
  .day-agenda{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface2)}
  .agenda-hour{display:grid;grid-template-columns:72px 1fr;border-top:1px solid rgba(255,255,255,.05);min-height:42px}
  .agenda-hour:first-child{border-top:none}
  .agenda-hour.now{background:rgba(229,57,53,.07)}
  .agenda-hour .hr{font-family:var(--mono);font-size:11px;color:var(--muted);padding:8px 12px;border-right:1px solid var(--border);text-align:right}
  .agenda-hour .slot{padding:8px 12px}
</style>
<!-- Shared HaloFire design system (AAA tokens + self-hosted fonts). -->
<link rel="stylesheet" href="/public/styles/halofire-tokens.css">
<style id="hf-glass-gold">:root{--gold:#d9a441}</style>
<script src="/public/halofire-auth.js"></script>
</head>
<body class="hf hf-shell" data-hf-page="calendar">
<!-- Top app bar (brandmark + nav + role chip + Sign out) is injected by /public/halofire-shell.js?v=11 -->
<main>
  <div class="banner"><b>NEEDS VERIFICATION</b> — Calendar core under construction (CAL-1). Dates and lanes below are placeholders, not scheduled work.</div>

  <div class="card">
    <div class="cal-head">
      <div style="display:flex;align-items:baseline;gap:10px">
        <div class="cal-title" id="calTitle">…</div>
        <span class="muted" id="calSub"></span>
      </div>
      <div class="cal-controls">
        <button class="nav-btn" id="prevBtn" title="Previous" aria-label="Previous">‹</button>
        <button class="nav-btn" id="todayBtn">Today</button>
        <button class="nav-btn" id="nextBtn" title="Next" aria-label="Next">›</button>
        <div class="view-toggle" role="tablist" aria-label="Calendar view">
          <button class="seg-btn" data-view="day">Day</button>
          <button class="seg-btn" data-view="week">Week</button>
          <button class="seg-btn on" data-view="month">Month</button>
        </div>
      </div>
    </div>
    <div id="calBody"></div>
  </div>

  <div class="card">
    <h2>AI activity · Awaiting approval</h2>
    <p class="muted" style="margin-bottom:10px">Bids the system has prepared that still require a human decision. Nothing is ever auto-sent.</p>
    <div id="lane"><span class="muted">loading…</span></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  // Sign out now lives in the shared app bar injected by /public/halofire-shell.js?v=11.

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // Day / Week / Month views with prev/next/Today navigation.
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var view = 'month';
  var cursor = new Date();
  function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
  function hourLabel(h) { return (h % 12 || 12) + ':00 ' + (h < 12 ? 'AM' : 'PM'); }

  function render() {
    var body = document.getElementById('calBody');
    var title = document.getElementById('calTitle');
    var sub = document.getElementById('calSub');
    var now = new Date();
    if (view === 'month') {
      title.textContent = MON[cursor.getMonth()] + ' ' + cursor.getFullYear();
      sub.textContent = 'month view';
      body.className = 'cal-grid';
      var html = DOW.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
      var first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      var start = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
      for (var i = 0; i < 42; i++) {
        var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        var out = d.getMonth() !== cursor.getMonth();
        html += '<div class="day' + (out ? ' out' : '') + (sameDay(d, now) ? ' today' : '') + '"><span class="n">' + d.getDate() + '</span></div>';
      }
      body.innerHTML = html;
    } else if (view === 'week') {
      var ws = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() - cursor.getDay());
      var we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6);
      var endStr = (ws.getMonth() === we.getMonth() ? '' : MON[we.getMonth()].slice(0, 3) + ' ') + we.getDate();
      title.textContent = MON[ws.getMonth()].slice(0, 3) + ' ' + ws.getDate() + ' – ' + endStr + ', ' + we.getFullYear();
      sub.textContent = 'week view';
      body.className = 'week-grid';
      var hrs = '';
      for (var h = 7; h <= 18; h++) { hrs += '<div class="wk-hour">' + (h % 12 || 12) + (h < 12 ? 'a' : 'p') + '</div>'; }
      var cols = '';
      for (var c = 0; c < 7; c++) {
        var wd = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + c);
        cols += '<div class="week-col' + (sameDay(wd, now) ? ' today' : '') + '"><div class="week-col-head"><div class="dn">' + DOW[c] + '</div><div class="dd">' + wd.getDate() + '</div></div><div class="week-body">' + hrs + '</div></div>';
      }
      body.innerHTML = cols;
    } else {
      title.textContent = cursor.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      sub.textContent = 'day view';
      body.className = 'day-agenda';
      var isToday = sameDay(cursor, now);
      var rows = '';
      for (var hh = 7; hh <= 18; hh++) {
        rows += '<div class="agenda-hour' + (isToday && now.getHours() === hh ? ' now' : '') + '"><div class="hr">' + hourLabel(hh) + '</div><div class="slot"></div></div>';
      }
      body.innerHTML = rows;
    }
  }
  function step(dir) {
    if (view === 'month') cursor = new Date(cursor.getFullYear(), cursor.getMonth() + dir, 1);
    else if (view === 'week') cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 7 * dir);
    else cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + dir);
    render();
  }
  function wireCalendarControls() {
    document.getElementById('prevBtn').onclick = function () { step(-1); };
    document.getElementById('nextBtn').onclick = function () { step(1); };
    document.getElementById('todayBtn').onclick = function () { cursor = new Date(); render(); };
    var segs = document.querySelectorAll('.seg-btn');
    segs.forEach(function (b) {
      b.onclick = function () {
        view = b.getAttribute('data-view');
        segs.forEach(function (x) { x.classList.toggle('on', x === b); });
        render();
      };
    });
  }

  function renderLane(bids) {
    var lane = document.getElementById('lane');
    var awaiting = (bids || []).filter(function (b) {
      var s = String(b.status || '').toLowerCase();
      return s !== 'won' && s !== 'lost';
    });
    if (!awaiting.length) {
      lane.innerHTML = '<span class="muted">Nothing awaiting approval.</span>';
      return;
    }
    lane.innerHTML = awaiting.slice(0, 12).map(function (b) {
      return '<div class="lane-item">' +
        '<div class="proj">' + esc(b.project || ('Bid #' + b.id)) + '</div>' +
        '<div class="meta">' + esc(b.contractor || '—') +
          (b.due_date ? ' · due ' + esc(b.due_date) : '') +
          ' · <span class="st">' + esc(b.status || 'Pending') + '</span></div>' +
        '<div class="approve-row">' +
          '<button type="button" disabled title="Approval flow ships with CAL-1">Approve &amp; send</button>' +
          '<span class="approve-note">disabled — human approval flow under construction (CAL-1)</span>' +
        '</div></div>';
    }).join('');
  }

  wireCalendarControls();
  render();
  HFAuth.guard().then(function (me) {
    if (!me) return;
    return HFAuth.api('/bids?limit=50').then(function (data) {
      renderLane(data && data.bids);
    });
  }).catch(function (err) {
    document.getElementById('lane').innerHTML =
      '<span class="muted">Could not load activity: ' + esc(err && err.message) + '</span>';
  });
})();
</script>
<!-- Shared shell: injects the top app bar, applies the saved glass theme, sets the per-page Fire color (gold). -->
<script src="/public/halofire-shell.js?v=11"></script>
</body>
</html>
